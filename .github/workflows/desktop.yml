name: Desktop Build (Flutter Windows)

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 静态门禁：pub 解析 + analyze + 单元测试。
  #
  # 刻意放在便宜得多的 ubuntu 上、并让 windows 作业 needs 它：Dart 侧的错误在
  # 分钟级反馈，不必等 5~10 分钟的 Windows 构建才知道写错了。
  # ---------------------------------------------------------------------------
  analyze:
    name: Analyze & test (Dart)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Toolchain versions
        run: flutter --version

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: flutter test
        run: flutter test

  # ---------------------------------------------------------------------------
  # Rust 后端静态门禁。
  #
  # 后端（161 条命令 / SQLite / 缩略图 / 采集）是本次重构**不动**的部分，
  # 但 Electron 工作流归档后它一度失去全部 CI 覆盖。这里补回 fmt + clippy。
  # 刻意**不**进入 windows 的 needs：lint 红要看得见，但不该拦住建得出产物。
  # ---------------------------------------------------------------------------
  rust:
    name: Lint (Rust backend)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/backend -> target
          prefix-key: desktop-backend-lint

      - name: Rustfmt check (backend)
        working-directory: apps/desktop/backend
        run: cargo fmt --check

      # cargo fmt 不会顺带检查 path 依赖的 ipc 层，这里显式各查一次
      - name: Rustfmt check (ipc layer)
        working-directory: apps/desktop/backend
        run: |
          cargo fmt --check --manifest-path crates/silvermoon-ipc/Cargo.toml
          cargo fmt --check --manifest-path crates/silvermoon-ipc-macros/Cargo.toml

      - name: Clippy
        working-directory: apps/desktop/backend
        run: cargo clippy --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # Windows x64 构建：Flutter 宿主 + Rust 侧车，两者放进同一个目录后打包。
  # ---------------------------------------------------------------------------
  windows:
    name: Windows x64 build
    needs: [analyze]
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Toolchain versions
        run: flutter --version

      # 侧车先编译：它比 Flutter 构建慢，且失败原因更值得更早暴露。
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/backend -> target
          prefix-key: desktop-backend-release

      - name: Build Rust backend (release)
        run: cargo build --release --manifest-path backend/Cargo.toml

      # windows/ 不入库，由当前 Flutter 模板现场生成（见 tool/bootstrap.ps1 顶部注释）
      - name: Bootstrap Windows platform folder
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tool/bootstrap.ps1

      - name: flutter pub get
        run: flutter pub get

      - name: Generate Windows app icon
        run: dart run flutter_launcher_icons

      # webview_windows 的插件用 <experimental/coroutine>，MSVC 14.5x 已把它升为硬错误
      # STL1011。bootstrap.ps1 已在 windows/CMakeLists.txt 里 add_compile_definitions，
      # 这里再补一层环境变量：CMake 首次 configure 会把 CXXFLAGS 并入 CMAKE_CXX_FLAGS，
      # 即便插件的 target 属性覆盖了目录属性，这一层也能兜住。
      - name: flutter build windows
        env:
          CXXFLAGS: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release

      - name: Stage sidecar and package portable zip
        shell: pwsh
        run: |
          $candidates = @(
            'build/windows/x64/runner/Release',
            'build/windows/runner/Release'
          )
          $release = $candidates |
            Where-Object { Test-Path (Join-Path $_ 'silvermoon.exe') } |
            Select-Object -First 1
          if (-not $release) {
            Write-Host '--- build tree ---'
            Get-ChildItem -Path build -Recurse -Directory -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
            throw 'Release directory not found (silvermoon.exe is missing)'
          }
          Write-Host "packaging: $release"

          # Rust 侧车必须与主程序同级，并按 sidecar.binary 重命名成
          # silvermoon-server.exe —— 宿主的解析顺序就是照这个名字写的
          # （apps/desktop/lib/host/sidecar.dart）。
          $sidecar = 'backend/target/release/silvermoon.exe'
          if (-not (Test-Path $sidecar)) {
            throw "sidecar binary not found: $sidecar"
          }
          Copy-Item $sidecar (Join-Path $release 'silvermoon-server.exe') -Force
          Get-ChildItem (Join-Path $release 'silvermoon*') |
            Select-Object Name, Length

          $zip = 'SilverMoon-windows-x64.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $release -DestinationPath $zip -Force
          Get-Item $zip | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: silvermoon-windows-x64
          path: apps/desktop/SilverMoon-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 交付：把 zip 挂到 Release 上（PR 不发布）
  # ---------------------------------------------------------------------------
  release:
    name: Publish build
    needs: [windows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect
        run: |
          mkdir -p dist
          find artifacts -type f -name '*.zip' -exec cp {} dist/ \;
          ls -lh dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ github.run_number }}
          name: SilverMoon Desktop build ${{ github.run_number }}
          prerelease: true
          body: |
            Flutter 桌面端（Windows x64）自动构建产物。**本包已内置 Rust 后端**
            （\`silvermoon-server.exe\`，与主程序同级）。

            **当前进度**：界面框架 + 真实后端（数据目录 / 旧数据迁移 / JsonStore / 就绪握手 /
            `POST /cmd` 命令通道 / `GET /events` SSE）。/images、/folders、/books、/stats、
            /novel-stats、/webdav、/osu 已接真实数据。

            **音乐播放层**：/music 与 /music/player 由 WebView2 承载复用原 Vue 的播放器
            （歌单 / 全屏播放器 / 迷你条），Web Audio 效果链保留在 WebView 内；中间层是本机
            loopback HTTP+SSE，设置与播放层共用同一份 settings.json，网易云 / 酷狗登录走既有
            后端命令。需要系统已装 **WebView2 Runtime**（Windows 11 自带；Win10 缺失时请装
            Evergreen Runtime），否则播放页会提示运行时缺失。

            尚未接入：托盘 / 全局热键 / 多窗口（播放器独立窗口、桌面歌词）、/desktop-lyrics、
            /extension-host、/treasure/market 仍是占位页。

            解压后运行 \`silvermoon.exe\`（Windows 10/11 x64）。
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
