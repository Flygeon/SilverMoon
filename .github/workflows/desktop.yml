name: Desktop Build (Electron Windows)

# 桌面端主线在回滚后重新是 Electron 实现（见 revert 提交 0115500）。
#
# 这套构建流程原本是仓库根目录的 .github/workflows/build.yml（9a25438 从 Tauri 迁到
# Electron 44 时建立），一直在根目录正常执行；monorepo 重构时它随应用目录一起挪到了
# apps/desktop/.github/ 下面，而 GitHub 只执行仓库根目录下的工作流，从那时起它便不再
# 被触发。本文件把它接回根目录：步骤、顺序、action 版本都照原文件搬，只补 monorepo
# 带来的路径差异。原文件保持不动，不做任何修改。
#
# 刻意让 windows 作业**不**依赖 lint：lint 红必须看得见，但不该拦住建得出产物。

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint (frontend + Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # clippy 要编译整棵依赖树；不缓存的话每轮都从零编一遍（实测约 124s）
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/backend -> target
          prefix-key: desktop-clippy

      # 后端只需要 native-tls 的 pkg-config 支持，不需要桌面框架的开发库
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Typecheck (renderer + electron main)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Rustfmt check (backend)
        working-directory: apps/desktop/backend
        run: cargo fmt --check

      # silvermoon-ipc 两个 crate 是 path 依赖、不属于 workspace 成员，
      # cargo fmt 不会顺带检查它们，这里显式各查一次
      - name: Rustfmt check (ipc layer)
        working-directory: apps/desktop/backend
        run: |
          cargo fmt --check --manifest-path crates/silvermoon-ipc/Cargo.toml
          cargo fmt --check --manifest-path crates/silvermoon-ipc-macros/Cargo.toml

      - name: Clippy
        working-directory: apps/desktop/backend
        run: cargo clippy --all-targets -- -D warnings

  windows:
    name: Windows x64 package (NSIS)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/backend -> target
          prefix-key: desktop-release

      # @electron/get 下载的 Electron 二进制与 electron-builder 的 nsis 工具链
      # 都不在 npm 缓存范围内，单独缓存能省下大量下载
      - name: Cache electron / electron-builder toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('apps/desktop/package-lock.json', 'apps/desktop/electron-builder.yml') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      # 后端必须先生成：electron-builder 会把它作为 extraResources 打进安装包
      - name: Build Rust backend (release)
        run: cargo build --release --manifest-path backend/Cargo.toml

      - name: Build renderer
        run: npm run build:renderer

      - name: Build electron main
        run: npm run build:main

      - name: Package (NSIS installer)
        run: npx electron-builder --win nsis --publish never

      - name: Show artifacts
        shell: pwsh
        run: Get-ChildItem release | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: silvermoon-windows-x64-installer
          path: apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish build
    needs: [windows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect
        run: |
          mkdir -p dist
          find artifacts -type f -name '*.exe' -exec cp {} dist/ \;
          ls -lh dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ github.run_number }}
          name: SilverMoon Desktop build ${{ github.run_number }}
          prerelease: true
          body: |
            SilverMoon 桌面端（Electron / Windows x64）自动构建产物。

            这是把桌面端主线回滚到重构前的 Electron 实现之后的首个构建：
            播放链路回到 Electron 内嵌的 Chromium，性能与重构前一致。

            Flutter 重构版（16 个提交：界面框架、真实后端接入、五条路由、loopback
            中间层与 WebView2 播放层）完整保留在分支 `flutter-desktop` 与标签
            `flutter-desktop-final`，没有删除。

            安装包是 NSIS 安装程序（`SilverMoon-<版本>-setup.exe`），运行后按向导安装；
            内部已内置 Rust 后端 `bin/silvermoon-server.exe`。
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
