name: Mobile Build (Flutter)

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'apps/desktop/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'apps/desktop/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/**/*.gradle*', 'apps/mobile/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Bootstrap platform folders
        run: |
          set -eux
          python3 -c "import pathlib;p=pathlib.Path('tool/bootstrap.sh');p.write_bytes(p.read_bytes().replace(b'\\r\\n',b'\\n'))"
          bash tool/bootstrap.sh "$PWD"
          ls -la android ios | head -40

      - name: flutter pub get
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Build mobile web bundle
        working-directory: apps/desktop
        run: |
          set -eux
          npm ci --no-audit --no-fund
          npx vite build --config vite.mobile.config.ts
          rm -rf ../mobile/assets/webapp
          mkdir -p ../mobile/assets/webapp
          cp -R dist-mobile/. ../mobile/assets/webapp/
          du -sh ../mobile/assets/webapp
          ls -la ../mobile/assets/webapp | head -30

      - name: flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: flutter build apk
        run: flutter build apk --release --split-per-abi

      - name: Verify APKs
        run: |
          set -euo pipefail
          ls -lh build/app/outputs/flutter-apk/ || true
          for f in build/app/outputs/flutter-apk/*.apk; do
            echo "=== $f ==="
            unzip -l "$f" > /dev/null && echo "  OK"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: silvermoon-android
          path: apps/mobile/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS IPA (unsigned)
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Bootstrap platform folders
        run: |
          set -eux
          python3 -c "import pathlib;p=pathlib.Path('tool/bootstrap.sh');p.write_bytes(p.read_bytes().replace(b'\\r\\n',b'\\n'))"
          bash tool/bootstrap.sh "$PWD"
          ls -la android ios | head -40

      - name: flutter pub get
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Build mobile web bundle
        working-directory: apps/desktop
        run: |
          set -eux
          npm ci --no-audit --no-fund
          npx vite build --config vite.mobile.config.ts
          rm -rf ../mobile/assets/webapp
          mkdir -p ../mobile/assets/webapp
          cp -R dist-mobile/. ../mobile/assets/webapp/
          du -sh ../mobile/assets/webapp
          ls -la ../mobile/assets/webapp | head -30

      - name: flutter build ios (no codesign)
        # --no-codesign 已经关掉签名，但新增的插件（webview_flutter / video_player）
        # 会让 xcodebuild 重新引入签名要求，CI 上拿不到开发者证书。这里再压一层
        # 显式构建设置。--verbose 是为了失败时能在日志里看到 xcodebuild 的真实报错。
        env:
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: 'NO'
          FLUTTER_XCODE_CODE_SIGNING_REQUIRED: 'NO'
          FLUTTER_XCODE_CODE_SIGN_IDENTITY: ''
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign --verbose 2>&1 | tail -n 400

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -qry ../SilverMoon-ios-unsigned.ipa Payload
          ls -lh ../SilverMoon-ios-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: silvermoon-ios
          path: apps/mobile/build/SilverMoon-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish installers
    needs: [android, ios]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect installers
        run: |
          set -eux
          mkdir -p dist
          find artifacts -type f \( -name '*.apk' -o -name '*.ipa' \) -exec cp {} dist/ \;
          ls -lh dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v${{ github.run_number }}
          name: SilverMoon Mobile build ${{ github.run_number }}
          prerelease: true
          body: |
            Flutter 移动端（音乐播放器）自动构建产物。

            - **Android**：`app-arm64-v8a-release.apk` / `app-armeabi-v7a-release.apk` / `app-x86_64-release.apk`（按 ABI 拆分）
            - **iOS**：`SilverMoon-ios-unsigned.ipa`（未签名，需自行用开发者证书重签后安装）

            本地曲库、在线音源（网易云 / 酷狗 / Meting）、动态背景、逐字歌词、硬件均衡器。
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}