# 桌面端 CI（apps/desktop，Tauri 2）。
#
# 与迁移前（Electron）的差异：
#   * 宿主层从「Electron 主进程 + Rust sidecar 两个进程」变成「Tauri 单进程」，
#     因此不再需要单独构建 sidecar 与 splash 启动器；
#   * 打包由 electron-builder 换成 tauri build（Windows NSIS / Linux AppImage / macOS dmg）；
#   * Rust 工程从 apps/desktop/backend 移到 apps/desktop/src-tauri。
#
# 保留原设计的取舍：
#   * build 作业**刻意不写 needs: lint** —— 构建是最慢的一环，串行等待会让总时长凭空多几分钟；
#   * rust-cache 与 lint 作业用不同 prefix-key，避免两边 target 互相覆盖缓存。
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

# 同一 ref 的新推送直接取消上一轮未完成的运行：连推多次时不会堆积排队。
# 只作用于同一分支/PR，tag 与 main 之间互不影响。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 让 cargo 在 Actions 上输出更紧凑的日志，减少 I/O
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # 静态检查：前端 lint/格式/类型 + Rust fmt/clippy/test
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # monorepo：应用在 apps/desktop 下，所有 run 步骤以此为工作目录
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          # monorepo：锁文件在应用目录下，setup-node 需要显式指路
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # wasm32 目标用于 npm run verify:rust-pure：把不带依赖的纯逻辑编成 wasm
          # 真实执行断言（本地没有 MSVC 时也能验证 Rust 行为）。
          targets: wasm32-unknown-unknown

      # clippy 要编译整棵依赖树；不缓存的话这一步每轮都要从零编一遍
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          # 与构建作业区分开，避免两边的 target 目录互相覆盖缓存
          prefix-key: clippy

      # Tauri 在 Linux 上需要 WebKitGTK / libsoup / librsvg 等一系列开发库，
      # 以及 native-tls 需要的 pkg-config + libssl-dev。
      # 这份清单取自 Tauri 2 官方文档的 Debian/Ubuntu 前置依赖。
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Typecheck (renderer)
        run: npm run typecheck

      # --no-file-parallelism：autoMixAlgo 是 CPU 密集的 FFT 用例，CI 上多 worker 抢核
      # 会偶发超时（本机实测：并行偶发失败 1 条，串行 800/800 全绿）。
      - name: Unit tests
        run: npx vitest run --no-file-parallelism

      # mock 与后端路由表的漂移检查。
      # mock 是「纯浏览器预览」的唯一依赖，路由表改名/删除后 mock 会留下永远命中
      # 不到的死分支（脚本对此报错）；新增命令未补 mock 则只提示覆盖率。
      - name: Mock / route-table drift check
        run: npm run verify:mock-coverage
      # 图标字体是子集化产物（272 个图标 / 约 90 KB，原全量 5.2 MB）。
      # 这条校验是**离线**的：只比对 manifest 与源码扫出来的图标名。
      # 新增图标却忘了重跑 scripts/fetch-icon-font.mjs 时，这里会失败并列出缺哪些
      # ——否则表现为「界面上某个图标空白」，很难查。
      - name: Icon font in sync with source
        run: npm run check:icon-font

      # Rust 纯逻辑的真实执行断言（不依赖链接器）：封面 Referer 伪装 / 扩展名推断 / 路径规范化
      - name: Rust pure-logic tests (executed via wasm)
        run: npm run verify:rust-pure

      - name: Rustfmt check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      # B 站协议层是 path 依赖、不属于 workspace，必须显式指定 manifest。
      - name: Rustfmt check (bilibili protocol crate)
        run: cargo fmt --check --manifest-path src-tauri/crates/silvermoon-bili/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # 在此之前 CI 只做「编译 + clippy」，从不执行任何 Rust 测试。
      - name: Unit tests (Rust lib)
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      # B 站协议层的单测（WBI 置换表、弹幕模式映射、归一化边界）挂在这个 crate 下，
      # 同样不是 workspace 成员，必须显式指定 manifest 才会被执行。
      - name: Unit tests (bilibili protocol)
        run: cargo test --manifest-path src-tauri/crates/silvermoon-bili/Cargo.toml

  # ---------------------------------------------------------------------------
  # 安装包：Windows NSIS / Linux AppImage / macOS dmg
  #
  # **刻意不写 `needs: lint`**：构建是整条流水线里最慢的一环（三个平台各自
  # Rust release 编译），串行等待 lint 会让总时长凭空多几分钟。
  # 若 lint 先失败，concurrency 会在下一次推送时直接取消这一轮，浪费可控。
  # ---------------------------------------------------------------------------
  build:
    name: build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            bundle-args: --bundles nsis
            artifact-name: windows-build
            artifact-path: |
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-latest
            label: linux
            bundle-args: --bundles appimage
            artifact-name: linux-build
            artifact-path: |
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          - os: macos-latest
            label: macos
            bundle-args: --bundles dmg
            artifact-name: macos-build
            artifact-path: |
              apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    # monorepo：应用在 apps/desktop 下，所有 run 步骤以此为工作目录
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 缓存 ~/.cargo 与 src-tauri/target：命中后 release 编译只重编改动过的 crate。
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          prefix-key: release

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      # tauri build 会自己跑 beforeBuildCommand（渲染进程 vite build），
      # 并把 src-tauri 作为主程序一起编译；无需再单独构建后端 / 启动器。
      #
      # --bundles 显式指定各平台产物，这样 artifact 路径精确、互不干扰
      # （tauri.conf.json 里 targets = "all"，交给 CLI 参数收窄）。
      # 非 tag 构建不发布，只产出安装包供上面的 artifact 步骤取走。
      - name: Build and bundle
        run: npx tauri build ${{ matrix.bundle-args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 打 tag 时发布
  # ---------------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true

      - name: List artifacts
        run: |
          set -euo pipefail
          find release-assets -maxdepth 3 -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/**/*.exe
            release-assets/**/*.AppImage
            release-assets/**/*.dmg

      - name: Ensure release is published (not draft / not prerelease)
        # tauri-plugin-updater 的 GitHub 源会跳过 draft 与 prerelease，
        # Release 必须以正式状态存在，否则客户端永远看不到更新。
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "tag=$TAG"
          json=''
          for i in $(seq 1 10); do
            json=$(gh release view "$TAG" --json isDraft,isPrerelease 2>/dev/null || true)
            [ -n "$json" ] && break
            sleep 6
          done
          echo "$json"
          if [ -z "$json" ]; then
            echo '::error::Release 不存在'
            exit 1
          fi
          if echo "$json" | grep -q '"isDraft":true'; then
            echo '::error::Release 仍是 draft，自动更新看不到'
            exit 1
          fi
          if echo "$json" | grep -q '"isPrerelease":true'; then
            echo '::error::Release 是 prerelease，自动更新看不到'
            exit 1
          fi
          echo 'release published OK'
