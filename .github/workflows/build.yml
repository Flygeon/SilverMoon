# 这是 apps/desktop/.github/workflows/build.yml 的根目录副本。
#
# 原文件随应用目录躺在 apps/desktop/.github/ 下，而 GitHub 只执行仓库根目录下的
# 工作流，所以 monorepo 重构后它不再被触发。此副本除下列 monorepo 路径差异外，
# 与原文件逐行一致（作业划分、matrix、缓存策略、tag 发布逻辑均未改动）：
#   * 两个作业加 defaults.run.working-directory: apps/desktop；
#   * setup-node 的 npm 缓存指向 apps/desktop/package-lock.json；
#   * rust-cache 的 workspaces 与两个 Rust 步骤的工作目录补 apps/desktop 前缀；
#   * 产物路径与 electron 缓存 key 补 apps/desktop 前缀。
# 原文件保持不动。
name: Build

on:
  push:
    # main 与特性分支都要跑。
    #
    # ⚠️ 为什么必须显式加 `feat/**`（本轮补的记录）：
    # 本仓库的推送走 GitHub **Git Data API**（沙箱里 HTTPS git push 直连不通），
    # 而用 API 更新 ref **不会**产生能让 PR 复用的 synchronize 事件 ——
    # 实测推完 `feat/win7-electron22` 后 GitHub 上**一个新 run 都不出现**，
    # 连 PR #1 的 head 明明已经更新了也一样。
    #
    # 于是「写完 push → 盯 CI 绿」这条流程在特性分支上其实是不成立的：
    # 看起来推成功了，其实没有任何检查在跑。之前那轮之所以有 CI，
    # 是因为它在 GitHub 界面上被触发过（event=pull_request），是运气而非机制。
    #
    # 加 `feat/**` 之后，特性分支的推送本身就会直接触发 push 事件，不再依赖 PR。
    branches: [main, 'feat/**']
    tags: ['v*']
  # PR 触发保留：从 GitHub 界面改 PR 时同样要跑。
  pull_request:
    branches: [main]
  # 手动兜底：万一推送仍未触发（网络/权限异常），可在 Actions 页面直接点运行。
  workflow_dispatch:

permissions:
  contents: write

# 同一 ref 的新推送直接取消上一轮未完成的运行：连推多次时不会堆积排队。
# 只作用于同一分支/PR，tag 与 main 之间互不影响。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 让 cargo 在 Actions 上输出更紧凑的日志，减少 I/O
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # 静态检查：前端 lint/格式/类型 + Rust fmt/clippy
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # monorepo：应用在 apps/desktop 下，所有 run 步骤以此为工作目录
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # 与 Electron 44 内置的 Node 对齐（Node 20 已被 actions 标记弃用）
          node-version: 22
          cache: npm
          # monorepo：锁文件在应用目录下，setup-node 需要显式指路
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # clippy 要编译整棵依赖树；不缓存的话这一步每轮都要从零编一遍（实测 ~124s）
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/backend -> target
          # 与构建作业区分开，避免两边的 target 目录互相覆盖缓存
          prefix-key: clippy

      # 后端只需要 native-tls 的 pkg-config 支持，无需任何桌面框架的开发库。
      #
      # 另外装 mingw-w64：用于在 Linux 上**交叉编译启动器**，
      # 以便校验图标资源真的嵌进了 exe（比等 Windows 作业快得多）。
      # 同时把 NSIS 自检要用的 nsis 一起装上。
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev mingw-w64 nsis

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Typecheck (renderer + electron main)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Rustfmt check (backend)
        working-directory: apps/desktop/backend
        run: cargo fmt --check

      # silvermoon-ipc 两个 crate 是 path 依赖、不属于 workspace 成员，
      # `cargo fmt` 不会顺带检查它们，因此这里显式各查一次
      - name: Rustfmt check (ipc layer)
        run: |
          cargo fmt --check --manifest-path backend/crates/silvermoon-ipc/Cargo.toml
          cargo fmt --check --manifest-path backend/crates/silvermoon-ipc-macros/Cargo.toml

      - name: Clippy (backend)
        working-directory: apps/desktop/backend
        run: cargo clippy --all-targets -- -D warnings

      # 启动器是 Windows 专用程序，但 fmt/clippy 都能在 Linux 上跑，
      # 因此质量检查留在最快的 lint 作业里，不必等 Windows 构建。
      # 注意：clippy 需要能解析 Windows 目标，故带 --target（构建脚本仍用宿主）。

      - name: Rustfmt check (launcher)
        working-directory: apps/desktop/splash
        run: cargo fmt --check

      # 启动器**纯逻辑**（路径解析 / 主题解析 / 动画数学）的单元测试。
      #
      # 关键：这些模块被刻意写成无平台依赖（挂在只服务测试的 lib target 上），
      # 于是能在 Linux 上用 `cargo test --lib` 跑**与发布二进制同一份代码**。
      # 它们拦的都是「只在发布版暴露」的缺陷：
      #   * 启动器曾假设与 SilverMoon.exe 同级，而 extraResources 实际放进
      #     resources/ → 装出来的应用打不开；
      #   * splash 亮/暗要跟随应用设置，而设置里 theme 与 readerTheme 并存，
      #     子串匹配会读错键。
      # 以上两类当时 CI 全绿却带着缺陷发布。
      - name: Launcher logic tests (path / theme / animation)
        run: npm run verify:splash-paths

      # 图标资源校验：**必须真的嵌进 exe**，否则快捷方式是空白图标。
      # 这里用 GNU 目标本地构建一份来验（比 Windows 作业快得多），
      # 能在 1 分钟内拦下「资源没编出来」这类静默失败。
      - name: Build launcher for resource check (GNU)
        run: |
          rustup target add x86_64-pc-windows-gnu
          cargo build --release --target x86_64-pc-windows-gnu --manifest-path splash/Cargo.toml

      - name: Verify launcher icon resource (.rsrc)
        run: npm run verify:splash-resources

      # NSIS 脚本只在 Windows 打包时才被编译；等到那时才发现语法错误就是 ~12 分钟一轮。
      # makensis 跨平台，这里先把语法与宏展开走一遍。
      - name: NSIS installer script syntax check
        run: npm run verify:nsis

      # color-mix 双构建验收。
      #
      # 为什么必须在这里拦：color-mix() 在 Chromium < 111（Electron 22 / Win7 版）
      # 上是**静默失效** —— 声明被直接丢弃、不报错，只在真机表现为「一堆半透明
      # 元素变透明」。而开发机是 Chromium 132，本地永远看不见这个问题。
      #
      # 两个方向都要验（互补，缺一不可）：
      #   * win7  : 回退开关打开后，CSS 里不得再有裸 color-mix，且兜底合法；
      #   * modern: 默认构建必须**保留**原生 color-mix、不得出现 --sm-mix-*，
      #             证明回退代码没有泄漏到正式版。
      - name: Verify color-mix fallback (win7 artifact)
        run: |
          npm run build:renderer:win7
          npm run verify:colormix -- --mode=win7

      - name: Verify color-mix fallback (modern artifact unchanged)
        run: |
          npm run build:renderer
          npm run verify:colormix -- --mode=modern

  # ---------------------------------------------------------------------------
  # 安装包：Windows NSIS / Linux AppImage
  #
  # **刻意不写 `needs: lint`**：构建是整条流水线里最慢的一环（Windows 侧
  # Rust release 编译 + 打包约 12 分钟），串行等待 lint 会让总时长凭空多 4 分钟。
  # 两者并行后，总时长由最慢的 Windows 决定。若 lint 先失败，
  # concurrency 会在下一次推送时直接取消这一轮，浪费可控。
  # ---------------------------------------------------------------------------
  build:
    name: build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            package-args: --win nsis
            artifact-name: windows-build
            artifact-path: apps/desktop/release/*.exe
            # @electron/get 的下载缓存与 electron-builder 的 nsis/appimage 工具链缓存
            # 不在 npm 缓存范围内，单独缓存后打包步骤能省下大量下载时间
            cache-paths: |
              ~/AppData/Local/electron/Cache
              ~/AppData/Local/electron-builder/Cache
          - os: ubuntu-latest
            label: linux
            package-args: --linux AppImage
            artifact-name: linux-build
            artifact-path: apps/desktop/release/*.AppImage
            cache-paths: |
              ~/.cache/electron
              ~/.cache/electron-builder

    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    # monorepo：应用在 apps/desktop 下，所有 run 步骤以此为工作目录
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          # monorepo：锁文件在应用目录下，setup-node 需要显式指路
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 缓存 ~/.cargo 与两个 Rust 工程的 target：命中后 release 编译只重编改动过的 crate。
      # splash（原生启动器）是独立 crate、target 目录也在自己下面，必须单独列出，
      # 否则每轮都要重编它的整棵 windows-rs 依赖树。
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/backend -> target
            apps/desktop/splash -> target
          prefix-key: release

      - name: Cache electron / electron-builder downloads
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cache-paths }}
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('apps/desktop/package-lock.json', 'apps/desktop/electron-builder.yml') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      # 后端必须先生成：electron-builder 会把它作为 extraResources 打进安装包
      - name: Build Rust backend (release)
        run: cargo build --release --manifest-path backend/Cargo.toml

      # 原生启动器（MD3 splash）：同样是 extraResources，必须**先于 electron-builder**
      # 生成，否则打包时会找不到 win.extraResources 里声明的 exe 而失败。
      # 只跑 Windows：它是 Windows GUI 程序（user32/gdi32），
      # 且 electron-builder.yml 只在 win 平台引用该产物。
      - name: Build native launcher (release)
        if: runner.os == 'Windows'
        run: cargo build --release --manifest-path splash/Cargo.toml

      # 打包前对启动器做**硬校验**（图标资源 + 体积）。
      #
      # 为什么必须让 CI 失败而不是只打 warning（真实教训）：
      # 图标嵌入失败时 build.rs 只打印 cargo:warning，构建照常成功；
      # 于是 CI 全绿、发布版快捷方式却没有图标 —— 直到用户装上才发现。
      # 实测就是这样漏过一次（MSVC 下裸 rc 不在 PATH，资源没编出来）。
      #
      # 校验脚本用**纯 Node 解析 PE 节表**，不依赖 objdump（仅 Linux 有）
      # 或 dumpbin（pwsh 里不保证在 PATH），跨平台行为一致。
      - name: Verify launcher artifact (icon + size)
        if: runner.os == 'Windows'
        run: npm run verify:splash-resources

      - name: Build renderer + electron main
        run: npm run build:renderer && npm run build:main

      - name: Package
        run: npx electron-builder ${{ matrix.package-args }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Win7 兼容版（Electron 22）：独立作业
  #
  # 为什么单独一个作业、跑在 Linux 上：
  #   * Win7 目标 `x86_64-win7-windows-gnu` 是 tier-3，要 nightly + `-Z build-std`
  #     从源码编 std；Windows runner 上反而更麻烦（还要额外装 mingw）。
  #   * Linux 上交叉编译出的 PE 已实测无 Win8+ 符号（见 verify-win7-build.mjs），
  #     不需要 Windows 才能产出可用二进制。
  #   * 与 `build` 作业完全并行，不拖慢现有流水线；产物独立上传。
  #
  # **刻意不写 needs**：与 lint / build 并行，最慢的一环决定总时长。
  # ---------------------------------------------------------------------------
  win7:
    name: build (win7 / Electron 22)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # Win7 目标需要 nightly（-Z build-std 仅 nightly 可用）+ rust-src
      - name: Setup Rust (nightly + rust-src)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      # tier-3 目标不自带链接器，需要 mingw-w64；pkg-config/libssl 是后端
      # native-tls 的宿主依赖。
      #
      # binutils 显式装上：`verify:win7` 用 `objdump -p` 检查两个 exe **没有**
      # 导入 WaitOnAddress 等 Win8+ 符号 —— 这正是「Win7 上加载即失败」的根因。
      # 虽然 ubuntu runner 自带 binutils，但一旦缺失，校验脚本会降级成「跳过」，
      # 那道闸门就形同虚设，所以这里写死依赖。
      #
      # wine **也是必需项**（实测踩过，不是可选项）：ubuntu-latest 上默认没有 wine，
      # 而 electron-builder 26 在 Linux 打 NSIS 包时，除了用 makensis 生成安装器，
      # 还要 **把刚生成的安装器跑一次**，让它自解压出卸载器：
      #   app-builder-lib/out/targets/nsis/NsisTarget.js
      #     → new WineVmManager(...).exec(installerPath, [], ...)
      # 漏装时构建到这一步直接红，报错只有一行 `wine process failed ENOENT`：
      #   ✓ building target=nsis file=...-setup.exe
      #   ✓ signing with signtool.exe path=...-setup.__uninstaller.exe
      #   ⨯ wine process failed ENOENT
      # 症状极具误导性 —— 前面的 makensis、7z、nsis-resources 下载全部成功，
      # 看起来「工具链都装好了」，实际只差一个 wine。
      #
      # 两处细节缺一不可：
      #   * `dpkg --add-architecture i386`：wine 的加载器链依赖 32 位用户态；
      #     不加 i386 时 `apt-get install wine` 会只装个壳，wine 命令存在却起不来。
      #   * `wine32:i386` 必须显式列出：NSIS 的 makensis.exe 与安装器都是 32 位 PE，
      #     纯 wine64 会在 WINEARCH 上直接拒绝。
      - name: Install system dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev mingw-w64 binutils wine wine32:i386

      - name: Rust cache (win7 target dir)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/backend -> target
            apps/desktop/splash -> target
          prefix-key: win7
          # build-std 的产物与普通 target 布局不同，单独缓存避免互相污染
          key: win7-electron22

      - name: Cache electron / electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron22-cache-${{ hashFiles('apps/desktop/package-lock.json', 'apps/desktop/electron-builder.win7.yml') }}
          restore-keys: |
            ${{ runner.os }}-electron22-cache-

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      # ---- 构建三块产物 ----
      # 1) + 2) Win7 后端与原生启动器
      #
      # 合成**一步**跑，而不是分两条 npm run：两者都要用打过补丁的 libstd，
      # 而准备补丁那一步涉及复制 ~75MB 的 rust-src 并替换 sysroot/library。
      # 分成两次会把这件事做两遍（虽然幂等，但纯属浪费 CI 时间）。
      # run-win7-build.mjs 会「准备一次 → 依次构建 → 还原」，
      # 且带 SIGINT 与 finally 双保险，保证 sysroot 不会留在被改状态。
      #
      # ⚠️ 依赖 `patch` 命令（应用 std 补丁）。ubuntu runner 自带，这里显式
      #    检查一次，免得将来换镜像时以「命令找不到」的模糊形式失败。
      - name: Build Rust backend + native launcher for Win7
        run: |
          command -v patch >/dev/null || { echo "缺少 patch 命令"; exit 1; }
          npm run build:rust:win7

      # 3) 渲染层（启用 color-mix 回退）+ Win7 主进程
      - name: Build renderer (color-mix fallback) + electron main
        run: |
          npm run build:renderer:win7
          npm run build:main:win7

      # ---- 验收（三道，全部失败即红） ----
      # a) Win7 产物静态检查：主进程无 Electron25+ API 直调、两个 exe 无 Win8+ 符号
      - name: Verify Win7 artifacts
        run: npm run verify:win7

      # b) color-mix 回退：CSS 里不得再有裸 color-mix，兜底必须合法
      - name: Verify color-mix fallback
        run: npm run verify:colormix -- --mode=win7

      # c) 打包成 NSIS 安装包（Electron 22.3.27，见 electron-builder.win7.yml）
      - name: Package Win7 NSIS installer
        run: npx electron-builder --config electron-builder.win7.yml --win nsis --publish never

      - name: Upload Win7 installer
        uses: actions/upload-artifact@v5
        with:
          name: windows-win7-build
          path: apps/desktop/release-win7/*.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 打 tag 时发布
  # ---------------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    # win7 也纳入：打 tag 时 Win7 兼容包应一并发布，否则用户拿不到。
    needs: [lint, build, win7]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**/*
