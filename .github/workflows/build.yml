name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # 手动重跑入口（把 CI 当「验证工具」时不必为了重跑而空提交）
  workflow_dispatch:

permissions:
  contents: write

# 同一 ref 的新推送直接取消上一轮未完成的运行：连推多次时不会堆积排队。
# 只作用于同一分支/PR，tag 与 main 之间互不影响。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # 静态检查：前端 lint/格式/类型 + Rust fmt/clippy
  #
  # ⚠️ 这些是**顺序步骤**：前面任一失败会 skip 后面的 Rust 验证。
  # 所以「lint 红了」不等于「Rust 已验证」—— 定位时要看清停在哪一步。
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # 后端只需要 native-tls 的 pkg-config 支持；Electron 侧无桌面框架开发库需求
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund

      - name: ESLint
        working-directory: apps/desktop
        run: npm run lint

      - name: Prettier check
        working-directory: apps/desktop
        run: npm run format:check

      - name: Typecheck (renderer + electron main)
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Unit tests
        working-directory: apps/desktop
        run: npx vitest run --no-file-parallelism

      - name: Mock / route-table drift check
        working-directory: apps/desktop
        run: npm run verify:mock-coverage

      - name: Icon font in sync with source
        working-directory: apps/desktop
        run: npm run check:icon-font

      # 配色令牌是**生成**的（shared/m3-theme.ts → src/tokens/theme.css）。
      # 改了内核却忘了重跑生成器时，这里会红 —— 与单测里的逐令牌比对互为双保险。
      - name: M3 color tokens in sync with kernel
        working-directory: apps/desktop
        run: npm run verify:m3-tokens

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/backend -> target
            apps/desktop/splash -> target
            apps/desktop/fqapi -> target
          prefix-key: clippy

      - name: Rustfmt check (backend)
        run: cargo fmt --check --manifest-path apps/desktop/backend/Cargo.toml

      # silvermoon-ipc 两个 crate 是 path 依赖、不属于 workspace 成员，
      # `cargo fmt` 不会顺带检查它们，因此这里显式各查一次
      - name: Rustfmt check (ipc layer)
        run: |
          cargo fmt --check --manifest-path apps/desktop/backend/crates/silvermoon-ipc/Cargo.toml
          cargo fmt --check --manifest-path apps/desktop/backend/crates/silvermoon-ipc-macros/Cargo.toml

      - name: Clippy (backend)
        run: cargo clippy --manifest-path apps/desktop/backend/Cargo.toml --all-targets -- -D warnings

      - name: Unit tests (backend pure logic)
        run: cargo test --manifest-path apps/desktop/backend/Cargo.toml --lib

      - name: Rustfmt check (splash launcher)
        run: cargo fmt --check --manifest-path apps/desktop/splash/Cargo.toml

      - name: Unit tests (splash pure logic)
        run: cargo test --manifest-path apps/desktop/splash/Cargo.toml --lib

      # 番茄内容源 sidecar。它是独立 crate（reqwest 0.13 + rustls），
      # 与 backend 的依赖版本不同，因此单独检查、单独缓存。
      - name: Rustfmt check (fqapi sidecar)
        run: cargo fmt --check --manifest-path apps/desktop/fqapi/Cargo.toml

      - name: Clippy (fqapi sidecar)
        run: cargo clippy --manifest-path apps/desktop/fqapi/Cargo.toml --all-targets -- -D warnings

      - name: Unit tests (fqapi pure logic)
        run: cargo test --manifest-path apps/desktop/fqapi/Cargo.toml --lib

  # ---------------------------------------------------------------------------
  # 番茄内容源 sidecar 的可执行文件
  #
  # 单独一个 job 的理由：lint 里那条只跑 `cargo test --lib`，它**不链接
  # binary**。sidecar 要靠 exe 才能跑自检（设备注册 → 书详情 → 解正文），
  # 所以必须真的 build 一次并把产物传出来，否则「能不能跑」永远没有答案。
  #
  # 与 build 矩阵并行，不拖慢安装包流水线。
  # ---------------------------------------------------------------------------
  fqapi:
    name: fqapi sidecar (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows
            os: windows-latest
            bin: silvermoon-fqapi.exe
          - label: linux
            os: ubuntu-latest
            bin: silvermoon-fqapi
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/fqapi -> target

      - name: Build sidecar (release)
        run: cargo build --release --manifest-path apps/desktop/fqapi/Cargo.toml

      # 冒烟测试：binary 能起来、打印握手行、响应 ping。
      # 不联网（不触发设备注册），只证明进程与协议是通的。
      - name: Smoke test (handshake + ping)
        shell: bash
        run: |
          set -euo pipefail
          BIN="apps/desktop/fqapi/target/release/${{ matrix.bin }}"
          test -f "$BIN" || { echo "missing $BIN"; exit 1; }
          export SILVERMOON_FQAPI_DATA="$RUNNER_TEMP/fqapi-smoke"
          # 送一行 ping 后关闭 stdin，让进程自己退出
          out=$(printf '{"id":1,"op":"ping"}\n' | "$BIN" 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q 'FQAPI_READY' || { echo "no handshake"; exit 1; }
          echo "$out" | grep -q '"pong":true' || { echo "ping failed"; exit 1; }
          echo "smoke ok"

      - name: Upload sidecar binary
        uses: actions/upload-artifact@v5
        with:
          name: fqapi-${{ matrix.label }}
          path: apps/desktop/fqapi/target/release/${{ matrix.bin }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 安装包：Windows NSIS / Linux AppImage / macOS dmg
  #
  # **刻意不写 `needs: lint`**：构建是整条流水线里最慢的一环，
  # 串行等待 lint 会让总时长凭空多几分钟。两者并行后由最慢的平台决定。
  # ---------------------------------------------------------------------------
  build:
    name: build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            package-args: --win nsis
            artifact-name: windows-build
            artifact-path: apps/desktop/release/*.exe
            cache-paths: |
              ~/AppData/Local/electron/Cache
              ~/AppData/Local/electron-builder/Cache
          - os: ubuntu-latest
            label: linux
            package-args: --linux AppImage
            artifact-name: linux-build
            artifact-path: apps/desktop/release/*.AppImage
            cache-paths: |
              ~/.cache/electron
              ~/.cache/electron-builder
          - os: macos-latest
            label: macos
            package-args: --mac dmg
            artifact-name: macos-build
            artifact-path: apps/desktop/release/*.dmg
            cache-paths: |
              ~/Library/Caches/electron
              ~/Library/Caches/electron-builder

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/backend -> target
            apps/desktop/splash -> target
            apps/desktop/fqapi -> target
          prefix-key: release

      # @electron/get 与 electron-builder 的工具链下载不在 npm 缓存范围内，
      # 单独缓存后打包步骤能省下大量下载时间
      - name: Cache electron / electron-builder downloads
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cache-paths }}
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('apps/desktop/package-lock.json', 'apps/desktop/electron-builder.yml') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund

      # 后端必须先生成：electron-builder 把它作为 extraResources 打进安装包
      - name: Build Rust backend (release)
        run: cargo build --release --manifest-path apps/desktop/backend/Cargo.toml

      # 原生启动器（仅 Windows）：它是**入口**，NSIS 快捷方式指向它
      - name: Build splash launcher
        if: runner.os == 'Windows'
        run: cargo build --release --manifest-path apps/desktop/splash/Cargo.toml

      # 番茄内容源 sidecar：electron-builder 会把它作为 extraResources 打进包。
      # 缺了它打包会因「文件不存在」直接失败，所以必须在上一步打包前产出。
      - name: Build fqapi sidecar (release)
        run: cargo build --release --manifest-path apps/desktop/fqapi/Cargo.toml

      - name: Build renderer + electron main
        working-directory: apps/desktop
        run: npm run build:renderer && npm run build:main

      - name: Package
        working-directory: apps/desktop
        run: npx electron-builder ${{ matrix.package-args }} --publish never

      # 打包产物自检：确认 extraResources 真的落地了。
      #
      # 为什么需要这一步：electron-builder 对「from 指向的文件不存在」确实会
      # 失败，但**如果那是唯一一条资源缺失、或者 to 路径写错**，现象可能是
      # 安装包里悄悄少一个文件 —— 用户装完才发现内容源不可用。断言在 CI 里
      # 比在本机拿压缩包猜要可靠。
      - name: Verify bundled resources
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN="apps/desktop/release/win-unpacked/resources/bin"
            EXE="silvermoon-fqapi.exe"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            BIN="apps/desktop/release/mac/SilverMoon.app/Contents/Resources/bin"
            EXE="silvermoon-fqapi"
          else
            BIN="apps/desktop/release/linux-unpacked/resources/bin"
            EXE="silvermoon-fqapi"
          fi
          if [ ! -d "$BIN" ]; then
            echo "目录不存在：$BIN —— 下面是 release/ 的实际结构"
            find apps/desktop/release -maxdepth 4 -type d | head -40
            exit 1
          fi
          ls -la "$BIN"
          test -f "$BIN/$EXE" || { echo "缺少 $EXE —— extraResources 未生效"; exit 1; }
          echo "OK: $EXE 已随包分发"

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 打 tag 时发布
  # ---------------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**/*
