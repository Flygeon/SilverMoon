name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # 手动重跑入口（把 CI 当「验证工具」时不必为了重跑而空提交）
  workflow_dispatch:

permissions:
  contents: write

# 同一 ref 的新推送直接取消上一轮未完成的运行：连推多次时不会堆积排队。
# 只作用于同一分支/PR，tag 与 main 之间互不影响。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # 静态检查：前端 lint/格式/类型 + Rust fmt/clippy
  #
  # ⚠️ 这些是**顺序步骤**：前面任一失败会 skip 后面的 Rust 验证。
  # 所以「lint 红了」不等于「Rust 已验证」—— 定位时要看清停在哪一步。
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # 后端只需要 native-tls 的 pkg-config 支持；Electron 侧无桌面框架开发库需求
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund

      - name: ESLint
        working-directory: apps/desktop
        run: npm run lint

      - name: Prettier check
        working-directory: apps/desktop
        run: npm run format:check

      - name: Typecheck (renderer + electron main)
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Unit tests
        working-directory: apps/desktop
        run: npx vitest run --no-file-parallelism

      - name: Mock / route-table drift check
        working-directory: apps/desktop
        run: npm run verify:mock-coverage

      - name: Icon font in sync with source
        working-directory: apps/desktop
        run: npm run check:icon-font

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/backend -> target
            apps/desktop/splash -> target
          prefix-key: clippy

      - name: Rustfmt check (backend)
        run: cargo fmt --check --manifest-path apps/desktop/backend/Cargo.toml

      # silvermoon-ipc 两个 crate 是 path 依赖、不属于 workspace 成员，
      # `cargo fmt` 不会顺带检查它们，因此这里显式各查一次
      - name: Rustfmt check (ipc layer)
        run: |
          cargo fmt --check --manifest-path apps/desktop/backend/crates/silvermoon-ipc/Cargo.toml
          cargo fmt --check --manifest-path apps/desktop/backend/crates/silvermoon-ipc-macros/Cargo.toml

      - name: Clippy (backend)
        run: cargo clippy --manifest-path apps/desktop/backend/Cargo.toml --all-targets -- -D warnings

      - name: Unit tests (backend pure logic)
        run: cargo test --manifest-path apps/desktop/backend/Cargo.toml --lib

      - name: Rustfmt check (splash launcher)
        run: cargo fmt --check --manifest-path apps/desktop/splash/Cargo.toml

      - name: Unit tests (splash pure logic)
        run: cargo test --manifest-path apps/desktop/splash/Cargo.toml --lib

  # ---------------------------------------------------------------------------
  # 安装包：Windows NSIS / Linux AppImage / macOS dmg
  #
  # **刻意不写 `needs: lint`**：构建是整条流水线里最慢的一环，
  # 串行等待 lint 会让总时长凭空多几分钟。两者并行后由最慢的平台决定。
  # ---------------------------------------------------------------------------
  build:
    name: build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            package-args: --win nsis
            artifact-name: windows-build
            artifact-path: apps/desktop/release/*.exe
            cache-paths: |
              ~/AppData/Local/electron/Cache
              ~/AppData/Local/electron-builder/Cache
          - os: ubuntu-latest
            label: linux
            package-args: --linux AppImage
            artifact-name: linux-build
            artifact-path: apps/desktop/release/*.AppImage
            cache-paths: |
              ~/.cache/electron
              ~/.cache/electron-builder
          - os: macos-latest
            label: macos
            package-args: --mac dmg
            artifact-name: macos-build
            artifact-path: apps/desktop/release/*.dmg
            cache-paths: |
              ~/Library/Caches/electron
              ~/Library/Caches/electron-builder

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/backend -> target
            apps/desktop/splash -> target
          prefix-key: release

      # @electron/get 与 electron-builder 的工具链下载不在 npm 缓存范围内，
      # 单独缓存后打包步骤能省下大量下载时间
      - name: Cache electron / electron-builder downloads
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cache-paths }}
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('apps/desktop/package-lock.json', 'apps/desktop/electron-builder.yml') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund

      # 后端必须先生成：electron-builder 把它作为 extraResources 打进安装包
      - name: Build Rust backend (release)
        run: cargo build --release --manifest-path apps/desktop/backend/Cargo.toml

      # 原生启动器（仅 Windows）：它是**入口**，NSIS 快捷方式指向它
      - name: Build splash launcher
        if: runner.os == 'Windows'
        run: cargo build --release --manifest-path apps/desktop/splash/Cargo.toml

      - name: Build renderer + electron main
        working-directory: apps/desktop
        run: npm run build:renderer && npm run build:main

      - name: Package
        working-directory: apps/desktop
        run: npx electron-builder ${{ matrix.package-args }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 打 tag 时发布
  # ---------------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/**/*
