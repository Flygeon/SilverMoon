# KMP 桌面端（apps/kmp-desktop）CI
#
# 与 apps/desktop 的 build.yml 是**两套独立流水线**：KMP 版复用同一个 Rust 后端
# （apps/desktop/src-tauri 多出一个无窗口的 silvermoon_bridge bin），
# 前端换成 Compose Multiplatform；目前只做 Windows。
#
# 触发范围收窄到 apps/kmp-desktop 与后端源码：Compose + jpackage 的构建代价
# 比 lint 高一个量级，不该被仓库其它目录的改动带起来。
name: KMP Desktop Build

on:
  push:
    branches: [main]
    paths:
      - 'apps/kmp-desktop/**'
      - 'apps/desktop/src-tauri/**'
      - 'apps/desktop/scripts/gen-bridge-dispatch.mjs'
      - '.github/workflows/kmpdesktop.yml'
  pull_request:
    paths:
      - 'apps/kmp-desktop/**'
      - 'apps/desktop/src-tauri/**'
      - '.github/workflows/kmpdesktop.yml'
  workflow_dispatch:

# 只读权限：本流水线**只产出 artifact，不发版**。
# 发版要等安装包在真机上验过一轮，届时再加 tag 触发与 release 作业。
permissions:
  contents: read

concurrency:
  group: kmpdesktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # 桥的派发表是从 Rust 源码机械生成的（scripts/gen-bridge-dispatch.mjs）；
  # 源码改了却忘了重新生成，运行期会以「未知命令」的形式炸在用户面前。
  # 放 Linux 上跑，十秒出结果。
  # ---------------------------------------------------------------------------
  verify-generated:
    name: Verify bridge dispatch table
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check generated dispatch table
        working-directory: apps/desktop
        run: node scripts/gen-bridge-dispatch.mjs --check

  # ---------------------------------------------------------------------------
  # Rust 后端：与桌面端同一个 crate，只是换一个 bin 入口（src/bin/silvermoon_bridge.rs）。
  # tauri-build 在编译期会校验两样东西，缺一样都直接失败：
  #   1. frontendDist 目录必须存在 —— 桥进程不带 WebView，放个占位页即可；
  #   2. tauri.windows.conf.json 声明的 bundle resource 必须存在 —— 也就是
  #      splash-bin/silvermoon-splash.exe（与 build.yml 一样，先编 splash 再编主程序）。
  # ---------------------------------------------------------------------------
  backend:
    name: Windows (bridge backend)
    runs-on: windows-latest
    timeout-minutes: 60
    needs: verify-generated
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 两个 target 都要缓存：splash 是独立 crate，不缓存每轮都要重编一遍。
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri -> target
            apps/desktop/splash -> target
          prefix-key: kmp-bridge

      - name: Prepare frontendDist placeholder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Set-Content -Path dist/index.html -Encoding UTF8 -Value '<!doctype html><html><head><meta charset="utf-8"><title>SilverMoon backend</title></head><body>backend-only build</body></html>'

      - name: Build splash launcher
        shell: pwsh
        run: |
          cargo build --release --manifest-path splash/Cargo.toml
          New-Item -ItemType Directory -Force -Path src-tauri/splash-bin | Out-Null
          Copy-Item splash/target/release/silvermoon-splash.exe src-tauri/splash-bin/
          Get-Item src-tauri/splash-bin/silvermoon-splash.exe | Select-Object Name, Length

      - name: Build bridge backend
        working-directory: apps/desktop/src-tauri
        run: cargo build --release --bin silvermoon_bridge

      - name: Upload bridge backend
        uses: actions/upload-artifact@v5
        with:
          name: silvermoon-bridge
          path: apps/desktop/src-tauri/target/release/silvermoon_bridge.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Compose Multiplatform 前端：编译 + 单测 + jpackage 打包。
  #
  # Rust 后端的 exe 不作为 classpath 资源（几十 MB，而且它本来就是独立进程），
  # 而是走 jpackage 的 app resource：CI 下到 composeApp/backend/，
  # 由 composeApp/build.gradle.kts 的 appResourcesRootDir 指过去。
  # ---------------------------------------------------------------------------
  app:
    name: Windows (MSI / EXE)
    runs-on: windows-latest
    timeout-minutes: 90
    needs: backend
    defaults:
      run:
        working-directory: apps/kmp-desktop
    steps:
      - uses: actions/checkout@v5

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download bridge backend
        uses: actions/download-artifact@v5
        with:
          name: silvermoon-bridge
          path: apps/kmp-desktop/composeApp/backend

      - name: Compile and unit test
        run: ./gradlew :composeApp:desktopTest :composeApp:desktopMainClasses --stacktrace

      # 先出「免安装应用目录」并立刻上传：它不依赖 WiX，永远能产出。
      # 后面 MSI / EXE 万一挂掉（WiX 版本、jpackage 参数），至少还有一个能跑的产物。
      - name: Package app image
        run: ./gradlew :composeApp:packageReleaseDistributable --stacktrace

      - name: Upload app image
        uses: actions/upload-artifact@v5
        with:
          name: silvermoon-kmp-windows-appimage
          path: apps/kmp-desktop/composeApp/build/compose/binaries/main/app/**
          if-no-files-found: warn

      # MSI / EXE 依赖 WiX（windows 镜像自带 WiX 3.14）。与 app image 分成两步，
      # 是为了在 WiX 缺失时把报错定位到打包环节而不是编译环节。
      - name: Package installers
        run: ./gradlew :composeApp:packageReleaseMsi :composeApp:packageReleaseExe --stacktrace

      - name: Collect checksums
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -File composeApp/build/compose/binaries/main |
            Where-Object { $_.Extension -in '.exe', '.msi' } |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)" } |
            Tee-Object -FilePath SHA256SUMS.txt

      - name: Upload installers
        uses: actions/upload-artifact@v5
        with:
          name: silvermoon-kmp-windows
          path: |
            apps/kmp-desktop/composeApp/build/compose/binaries/main/*/*.exe
            apps/kmp-desktop/composeApp/build/compose/binaries/main/*/*.msi
          if-no-files-found: error

      - name: Upload checksums
        uses: actions/upload-artifact@v5
        with:
          name: silvermoon-kmp-windows-sha256
          path: apps/kmp-desktop/SHA256SUMS.txt
