name: KMP Desktop

# SilverMoon 的 Kotlin Multiplatform（Compose Multiplatform）桌面端。
#
# 两个可独立失败的关注点：
#   backend  —— 复用 apps/desktop/src-tauri 的 Rust 业务后端，额外产出一个
#               无窗口的 silvermoon_bridge.exe（见 src/bridge 与 src/bin）；
#   app      —— Compose Desktop 前端，把后端 exe 作为 jpackage 的 app resource 打进去。
#
# 本地没有 Kotlin/Gradle/Windows SDK 的开发机就用这个 workflow 当验证环境：
# 推上去看 Actions（也支持 workflow_dispatch 手动触发）。

on:
  push:
    branches: [main]
    paths:
      - "apps/kmp-desktop/**"
      - "apps/desktop/src-tauri/**"
      - "apps/desktop/scripts/gen-bridge-dispatch.mjs"
      - ".github/workflows/kmpdesktop.yml"
    tags:
      - "kmp-v*"
  pull_request:
    paths:
      - "apps/kmp-desktop/**"
      - "apps/desktop/src-tauri/**"
      - ".github/workflows/kmpdesktop.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # 1. 生成物一致性：桥的派发表是从 Rust 源码机械生成的，必须与源码同步。
  #    放 ubuntu 上跑，几十秒出结果，不用等 Windows 编译。
  # ---------------------------------------------------------------------------
  verify-generated:
    name: Verify bridge dispatch table
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 校验 dispatch.generated.rs 与 Rust 源码一致
        working-directory: apps/desktop
        run: node scripts/gen-bridge-dispatch.mjs --check

  # ---------------------------------------------------------------------------
  # 2. Rust 后端（无窗口桥进程）
  # ---------------------------------------------------------------------------
  backend:
    name: Build Rust bridge backend
    runs-on: windows-latest
    needs: verify-generated
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # tauri-build 在编译期要求 frontendDist 目录存在。桥进程不带 WebView，
      # 用不上前端资源，放一个占位页即可（真正的 UI 在 Compose 侧）。
      - name: 准备 frontendDist 占位
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path apps/desktop/dist | Out-Null
          Set-Content -Path apps/desktop/dist/index.html -Encoding UTF8 -Value '<!doctype html><html><head><meta charset="utf-8"><title>SilverMoon backend</title></head><body>backend-only build</body></html>'

      - name: 编译桥进程
        working-directory: apps/desktop/src-tauri
        run: cargo build --release --bin silvermoon_bridge

      - name: 上传后端可执行文件
        uses: actions/upload-artifact@v4
        with:
          name: silvermoon-bridge
          path: apps/desktop/src-tauri/target/release/silvermoon_bridge.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. KMP 前端 + 装配 + 打包（Windows）
  # ---------------------------------------------------------------------------
  app:
    name: Build KMP desktop app (Windows)
    runs-on: windows-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 放入 Rust 后端
        uses: actions/download-artifact@v4
        with:
          name: silvermoon-bridge
          path: apps/kmp-desktop/composeApp/backend

      - name: 编译 + 单元测试
        working-directory: apps/kmp-desktop
        run: ./gradlew :composeApp:desktopTest :composeApp:desktopMainClasses --stacktrace

      - name: 生成可运行应用目录
        working-directory: apps/kmp-desktop
        run: ./gradlew :composeApp:packageReleaseDistributable --stacktrace

      - name: 打包安装包（MSI / EXE，需要 WiX）
        working-directory: apps/kmp-desktop
        run: ./gradlew :composeApp:packageReleaseMsi :composeApp:packageReleaseExe --stacktrace

      - name: 收集产物
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -File apps/kmp-desktop/composeApp/build/compose/binaries/main |
            Where-Object { $_.Extension -in '.exe', '.msi' } |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)" } |
            Tee-Object -FilePath SHA256SUMS.txt

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: silvermoon-kmp-windows
          path: |
            apps/kmp-desktop/composeApp/build/compose/binaries/main/*/*.exe
            apps/kmp-desktop/composeApp/build/compose/binaries/main/*/*.msi
          if-no-files-found: error

      - name: 上传可运行目录（免安装）
        uses: actions/upload-artifact@v4
        with:
          name: silvermoon-kmp-windows-appimage
          path: apps/kmp-desktop/composeApp/build/compose/binaries/main/app/**
          if-no-files-found: warn

      - name: 上传校验和
        uses: actions/upload-artifact@v4
        with:
          name: silvermoon-kmp-windows-sha256
          path: SHA256SUMS.txt

  # ---------------------------------------------------------------------------
  # 4. tag 触发时发布 prerelease
  # ---------------------------------------------------------------------------
  release:
    name: Publish prerelease
    if: startsWith(github.ref, 'refs/tags/kmp-v')
    runs-on: ubuntu-latest
    needs: app
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            dist/silvermoon-kmp-windows/**/*.exe
            dist/silvermoon-kmp-windows/**/*.msi
            dist/silvermoon-kmp-windows-sha256/SHA256SUMS.txt
          generate_release_notes: true
