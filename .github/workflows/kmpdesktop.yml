# KMP 桌面端（apps/kmp-desktop）CI
#
# 与 apps/desktop 的 build.yml 是**两套独立流水线**：KMP 版复用同一个 Rust 后端
# （apps/desktop/src-tauri 多出一个无窗口的 silvermoon_bridge bin），
# 前端换成 Compose Multiplatform；目前只做 Windows。
#
# 触发范围收窄到 apps/kmp-desktop 与后端源码：Compose + jpackage 的构建代价
# 比 lint 高一个量级，不该被仓库其它目录的改动带起来。
#
# 编译与打包**分成两个作业**：Rust 后端要 10 分钟以上，而 Kotlin 编译错误
# 三分钟就该看到。packaging 才需要后端的 exe，编译不需要，所以不让它等。
name: KMP Desktop Build

on:
  push:
    branches: [main]
    paths:
      - 'apps/kmp-desktop/**'
      - 'apps/desktop/src-tauri/**'
      - 'apps/desktop/scripts/gen-bridge-dispatch.mjs'
      - '.github/workflows/kmpdesktop.yml'
  pull_request:
    paths:
      - 'apps/kmp-desktop/**'
      - 'apps/desktop/src-tauri/**'
      - '.github/workflows/kmpdesktop.yml'
  workflow_dispatch:

# 只读权限：本流水线**只产出 artifact，不发版**。
# 发版要等安装包在真机上验过一轮，届时再加 tag 触发与 release 作业。
permissions:
  contents: read

concurrency:
  group: kmpdesktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # 桥的派发表是从 Rust 源码机械生成的（scripts/gen-bridge-dispatch.mjs）；
  # 源码改了却忘了重新生成，运行期会以「未知命令」的形式炸在用户面前。
  # 放 Linux 上跑，十秒出结果。
  # ---------------------------------------------------------------------------
  verify-generated:
    name: Verify bridge dispatch table
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check generated dispatch table
        working-directory: apps/desktop
        run: node scripts/gen-bridge-dispatch.mjs --check

  # ---------------------------------------------------------------------------
  # Kotlin 编译 + 单测。**不依赖后端**：编译期用不到 Rust 的 exe，
  # 把它挡在后面只会让语法错误多等十几分钟。
  # ---------------------------------------------------------------------------
  app-compile:
    name: Kotlin compile and unit test
    runs-on: windows-latest
    timeout-minutes: 60
    needs: verify-generated
    defaults:
      run:
        working-directory: apps/kmp-desktop
    steps:
      - uses: actions/checkout@v5

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile and unit test
        run: ./gradlew :composeApp:desktopTest :composeApp:desktopMainClasses --stacktrace

  # ---------------------------------------------------------------------------
  # Rust 后端：与桌面端同一个 crate，只是换一个 bin 入口（src/bin/silvermoon_bridge.rs）。
  # tauri-build 在编译期会校验两样东西，缺一样都直接失败：
  #   1. frontendDist 目录必须存在 —— 桥进程不带 WebView，放个占位页即可；
  #   2. tauri.windows.conf.json 声明的 bundle resource 必须存在 —— 也就是
  #      splash-bin/silvermoon-splash.exe（与 build.yml 一样，先编 splash 再编主程序）。
  # ---------------------------------------------------------------------------
  backend:
    name: Windows (bridge backend)
    runs-on: windows-latest
    timeout-minutes: 60
    needs: verify-generated
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 两个 target 都要缓存：splash 是独立 crate，不缓存每轮都要重编一遍。
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri -> target
            apps/desktop/splash -> target
          prefix-key: kmp-bridge

      - name: Prepare frontendDist placeholder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Set-Content -Path dist/index.html -Encoding UTF8 -Value '<!doctype html><html><head><meta charset="utf-8"><title>SilverMoon backend</title></head><body>backend-only build</body></html>'

      - name: Build splash launcher
        shell: pwsh
        run: |
          cargo build --release --manifest-path splash/Cargo.toml
          New-Item -ItemType Directory -Force -Path src-tauri/splash-bin | Out-Null
          Copy-Item splash/target/release/silvermoon-splash.exe src-tauri/splash-bin/
          Get-Item src-tauri/splash-bin/silvermoon-splash.exe | Select-Object Name, Length

      - name: Build bridge backend
        working-directory: apps/desktop/src-tauri
        run: cargo build --release --bin silvermoon_bridge

      - name: Upload bridge backend
        uses: actions/upload-artifact@v5
        with:
          name: silvermoon-bridge
          path: apps/desktop/src-tauri/target/release/silvermoon_bridge.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # jpackage 打包。到这里才需要后端 exe：它不是 classpath 资源（几十 MB，
  # 而且本来就是独立进程），而是走 jpackage 的 app resource ——
  # CI 下到 composeApp/backend/，由 composeApp/build.gradle.kts 的
  # appResourcesRootDir 指过去。
  # ---------------------------------------------------------------------------
  package:
    name: Windows (MSI / EXE)
    runs-on: windows-latest
    timeout-minutes: 90
    needs: [backend, app-compile]
    defaults:
      run:
        working-directory: apps/kmp-desktop
    steps:
      - uses: actions/checkout@v5

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download bridge backend
        uses: actions/download-artifact@v5
        with:
          name: silvermoon-bridge
          path: apps/kmp-desktop/composeApp/src/desktopMain/resources/backend

      # 把 compose 插件实际注册的打包任务打出来：任务名随插件版本变过
      # （应用目录是 create*Distributable，安装包是 package*），留在日志里方便对照。
      - name: List distribution tasks
        shell: pwsh
        run: |
          ./gradlew :composeApp:tasks --all --console=plain |
            Select-String -Pattern 'istributable|ackage' |
            Select-Object -First 40

      # 先出「免安装应用目录」并立刻上传：它不依赖 WiX，永远能产出。
      # 后面 MSI / EXE 万一挂掉（WiX 版本、jpackage 参数），至少还有一个能跑的产物。
      - name: Package app image
        run: ./gradlew :composeApp:createReleaseDistributable --stacktrace

      # 「装好即可用」的真正前提：后端 exe 进了**应用 jar**（运行时由 Kotlin 侧释放到
      # %APPDATA%\SilverMoon\backend\ 再拉起）。这里断言 jar 而不是分发目录里的裸文件，
      # 是因为后者的落盘位置随打包工具版本漂移 —— 上一轮就是 appResourcesRootDir
      # 静默失效：Gradle 任务成功、分发目录里却没有文件，用户装完直接弹「找不到后端」。
      - name: Verify backend is bundled in the app jar
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $jars = Get-ChildItem -Recurse -File composeApp/build/libs -Filter *.jar
          Write-Host "jars: $($jars.Name -join ', ')"
          $bundled = $false
          foreach ($jar in $jars) {
            $zip = [System.IO.Compression.ZipFile]::OpenRead($jar.FullName)
            $entry = $zip.Entries | Where-Object { $_.FullName -eq 'backend/silvermoon_bridge.exe' }
            $zip.Dispose()
            if ($entry) {
              Write-Host "backend bundled in $($jar.Name): $([math]::Round($entry.Length / 1MB, 1)) MB"
              $bundled = $true
              break
            }
          }
          if (-not $bundled) {
            Write-Host '::error::应用 jar 里没有 backend/silvermoon_bridge.exe，装出来的包跑不起来'
            exit 1
          }
          Write-Host '--- app image top level ---'
          Get-ChildItem 'composeApp/build/compose/binaries/main-release/app' -ErrorAction SilentlyContinue | Select-Object Name

      - name: Upload app image
        uses: actions/upload-artifact@v5
        with:
          name: silvermoon-kmp-windows-appimage
          path: apps/kmp-desktop/composeApp/build/compose/binaries/main-release/app/**
          if-no-files-found: warn

      # MSI / EXE 依赖 WiX（windows 镜像自带 WiX 3.14）。与 app image 分成两步，
      # 是为了在 WiX 缺失时把报错定位到打包环节而不是编译环节。
      - name: Package installers
        run: ./gradlew :composeApp:packageReleaseMsi :composeApp:packageReleaseExe --stacktrace

      - name: Collect checksums
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -File composeApp/build/compose/binaries/main-release |
            Where-Object { $_.Extension -in '.exe', '.msi' } |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)" } |
            Tee-Object -FilePath SHA256SUMS.txt

      - name: Upload installers
        uses: actions/upload-artifact@v5
        with:
          name: silvermoon-kmp-windows
          path: |
            apps/kmp-desktop/composeApp/build/compose/binaries/main-release/*/*.exe
            apps/kmp-desktop/composeApp/build/compose/binaries/main-release/*/*.msi
          if-no-files-found: error

      - name: Upload checksums
        uses: actions/upload-artifact@v5
        with:
          name: silvermoon-kmp-windows-sha256
          path: apps/kmp-desktop/SHA256SUMS.txt
