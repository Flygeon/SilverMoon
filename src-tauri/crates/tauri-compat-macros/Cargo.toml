[package]
name = "tauri-compat-macros"
version = "1.0.0"
description = "proc-macros backing the `tauri` compatibility shim (SilverMoon)"
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.82"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
serde_json = "1"
