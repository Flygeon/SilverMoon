[package]
name = "silvermoon"
version = "1.2.1"
description = "SilverMoon —— 本地优先全媒体库应用（Electron + Vue 3 + Rust 后端）"
authors = ["SilverMoon"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.82"

[lib]
name = "silvermoon_lib"
crate-type = ["rlib"]

# ---------------------------------------------------------------------------
# 依赖说明（迁移自 LumiLuna / Tauri）
#
# 迁移到 Electron 后，以下依赖被移除：
#   * tauri-build              —— 不再生成 capabilities / schemas
#   * tauri-plugin-dialog      —— 前端能力，改由 Electron 主进程承担
#   * tauri-plugin-fs          —— 同上
#   * tauri-plugin-store       —— 同上
#   * tauri-plugin-opener      —— 同上（Rust 侧仅 extension.rs 用到，已由兼容层实现）
#   * tauri-plugin-http        —— 同上
#   * tauri-plugin-global-shortcut —— 同上（Rust 侧仅 extension.rs 用到，已由兼容层实现）
#
# `tauri` 本身被换成同名兼容层 crate：业务代码里的 `use tauri::...` / `#[tauri::command]`
# 全部保持原样，命令改由本地 HTTP 服务暴露。详见 crates/tauri-compat/src/lib.rs。
# ---------------------------------------------------------------------------

[dependencies]
tauri = { path = "crates/tauri-compat" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
# 错误处理规范化：thiserror 用于定义强类型错误枚举，anyhow 用于内部函数便捷传播
thiserror = "1"
anyhow = "1"
walkdir = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
lofty = "0.20"
kamadak-exif = "0.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "ico"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"
scraper = "0.20"
regex = "1"
tokio = { version = "1", features = ["full"] }
rayon = "1"
base64 = "0.22"
getrandom = "0.2"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "stream", "native-tls", "charset", "gzip", "json"] }
# WebDAV 直接用到的传递依赖需显式声明（Rust 不允许隐式使用传递依赖）
url = "2"
httpdate = "1"
percent-encoding = "2"
# 网易云音乐 weapi/eapi 签名（移植自 api-enhanced，纯 Rust 实现）
aes = "0.8"
cbc = "0.1"
ecb = "0.1"
rsa = { version = "0.9", features = ["pem", "hazmat"] }
md-5 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
# 网易云 xeapi 协议（匿名身份注册，风控必需）：X25519 + AES-128-GCM + HMAC-SHA256 + gzip
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
flate2 = "1"
roxmltree = "0.20"
# WebDAV / anime 媒体本地代理：绑定 127.0.0.1 随机端口的轻量 HTTP 服务（SMTC 封面服务同款，跨平台）
tiny_http = "0.12"
# 酷狗音乐 API 客户端（vendored from MD3Music，AGPL-3.0）。
# 以 path 依赖形式链接：kugou.rs 经 kugou_server::bridge 进程内直调其路由表，
# 不启动其 HTTP 服务端。该 crate 内已自带 ureq/sha1/rand/qrcode 等依赖。
kugou_server = { path = "kugou_server" }

# Windows 系统媒体控件（SMTC）：把本应用注册为系统媒体会话。
# 仅在 Windows 编译，Linux/macOS 构建不受影响。
[target.'cfg(windows)'.dependencies]
smtc-tokio = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
# 注意：**不要**开 `panic = "abort"`。侧车现在是长期驻留的独立进程，
# 保留 unwind 语义才能让某个命令的 panic 只影响当次调用，而不是整块后端一起退出。
