<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>SilverMoon</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #101014;
        color: #e6e1e5;
        font-family: system-ui, -apple-system, "Noto Sans SC", sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
      }
      .t {
        font-size: 18px;
        font-weight: 600;
      }
      .d {
        font-size: 13px;
        line-height: 1.7;
        opacity: 0.7;
        max-width: 30em;
      }
      code {
        font-family: ui-monospace, monospace;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="t">音乐模块的 Web 资源尚未构建</div>
      <div class="d">
        本页是占位文件。正式产物由 CI 执行
        <code>vite build --config vite.mobile.config.ts</code>（位于 apps/desktop）
        后拷入 <code>apps/mobile/assets/webapp/</code>。
      </div>
    </div>
  </body>
</html>
