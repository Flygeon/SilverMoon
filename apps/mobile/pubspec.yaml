name: silvermoon
description: "SilverMoon（银月）移动端 — 本地优先全媒体库 · 音乐播放器"
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # 状态管理
  provider: ^6.1.2
  # 音频内核：just_audio + 后台/通知栏（just_audio_background 内含 audio_service）
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  audio_session: ^0.2.4
  # 网络
  http: ^1.2.2
  crypto: ^3.0.6
  # 酷狗手机号登录要 AES-CBC + RSA 裸模幂（桌面端在 Rust 的 crypto.rs 里）。
  # 4.x 去掉了已废弃的 js 依赖，3.x 的 js>=0.6.3 <0.8.0 会和现代 Flutter 冲突。
  pointycastle: ^4.0.0
  # 存储 / 路径
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  path: ^1.9.0
  # 封面
  cached_network_image: ^3.4.1
  # 视频页签播放
  video_player: ^2.14.0
  # 权限（本地媒体库）
  # 13.x 的 permission_handler_android 14.1.0 要求 compileSdk=37（AGP 9.1 上限 36），
  # 12.x 已把 Permission.audio 正确映射到 Android 的 READ_MEDIA_AUDIO。
  permission_handler: ^12.0.2
  # Monet 动态取色（Android 12+ / iOS 16+）
  # 注意：dynamic_color 2.x 起改用 material_ui(M3E) 的 ColorScheme，
  # 与 Flutter 自带 ColorScheme 不兼容，故锁在 1.9.x。
  dynamic_color: ^1.9.0
  # 本地音频标签解析（ID3 / VorbisComment / MP4 atom）
  audio_metadata_reader: ^1.8.0
  # iOS 的图片/视频只能从系统相册取（文件系统里没有用户照片）。
  # Android 不走它，那边 DCIM/Pictures 是真实可读的路径。
  photo_manager: ^3.6.0
  # 文件系统里的视频抽首帧当封面（相册视频由 photo_manager 出，不走它）
  # 不要用 video_thumbnail：0.5.6 停更，android/build.gradle 还在调 Gradle 8
  # 已移除的 jcenter()，构建期直接失败。这个包 3.x 要求 Flutter>=3.44，是活的。
  fc_native_video_thumbnail: ^3.0.1
  url_launcher: ^6.3.1
  # 扫码登录要原生渲染二维码（复用桌面端 Vue 前端时是前端自己画的）。
  # 纯 Dart，无原生代码。
  qr_flutter: ^4.1.0
  collection: ^1.19.1
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  # Android 用带圆角的那张：Android 不会给传统图标套蒙版，圆角必须烘进图片。
  image_path: "assets/icon/app_icon_rounded.png"
  # iOS 用满幅不透明的那张：系统自己套超椭圆蒙版，带 alpha 的圆角会被压成黑色。
  image_path_ios: "assets/icon/app_icon.png"
