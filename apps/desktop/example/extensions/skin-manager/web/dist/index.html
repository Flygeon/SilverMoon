<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>皮肤管理</title>
    <!--
      皮肤管理器 —— 演示「皮肤即扩展」模型。

      设置页不再管理皮肤，皮肤改由扩展分发与切换。这个扩展：
        · manifest.contributes.themes 声明自带的两套皮肤（themes/aurora、themes/sakura）；
        · 本页面调宿主的 themes:* 桥方法列出 / 应用 / 恢复。

      注意本扩展**没有引擎**：themes:list / themes:apply / themes:clear 是宿主保留方法，
      宿主自己处理，不会转发给引擎 —— 所以 manifest 里没有 engines 字段。

      路径基准（最容易踩的坑，详见 doc/扩展开发指南.md 第 8.2 节）：
        · dir  —— 相对【扩展根目录】，如 "themes/sakura"
        · files —— 相对【主题目录本身】，如 "assets/bg.png"（与 skin.json 内部引用同基准）
        所以 files 可以直接喂给 skinSchema 校验器；拼绝对路径用 dir 而非 files。
    -->
    <style>
      :root {
        color-scheme: dark;
        --bg: #1b1d22;
        --panel: #23262c;
        --fg: #e6e6ea;
        --dim: rgba(230, 230, 234, 0.55);
        --line: rgba(255, 255, 255, 0.09);
        --accent: #e88bb0;
        --ok: #9ece6a;
        --bad: #f7768e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        overflow: hidden;
      }
      .bar {
        flex-shrink: 0;
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 10px;
        background: rgba(255, 255, 255, 0.04);
        border-bottom: 1px solid var(--line);
        -webkit-app-region: drag;
        user-select: none;
      }
      .bar .title { font-size: 12px; color: var(--dim); }
      .bar button { -webkit-app-region: no-drag; }

      main { flex: 1; overflow: auto; padding: 16px; }
      h2 { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--dim); }

      .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
      .card {
        padding: 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .card.active { border-color: var(--accent); }
      .card .name { font-weight: 600; }
      .card .meta { font-size: 12px; color: var(--dim); min-height: 2.6em; }
      .swatch {
        width: 100%; height: 34px; border-radius: 8px;
        border: 1px solid var(--line);
        background-image: linear-gradient(135deg, #4a5fc1, #7a4e9e);
      }
      .swatch.sakura { background-image: linear-gradient(135deg, #ffd9e6, #a84e76); }
      .swatch.builtin { background-image: linear-gradient(135deg, #303030, #9a9a9a); }
      .card .ops { display: flex; gap: 8px; margin-top: auto; }

      button {
        font: inherit; color: var(--fg); background: transparent;
        border: 1px solid var(--line); border-radius: 8px;
        padding: 5px 10px; cursor: pointer;
      }
      button:hover:not(:disabled) { border-color: var(--accent); }
      button:disabled { opacity: 0.5; cursor: default; }
      button.primary { background: color-mix(in srgb, var(--accent) 22%, transparent); border-color: var(--accent); }

      .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
      .state { font-size: 12px; padding: 1px 8px; border-radius: 9px; background: rgba(255,255,255,.08); color: var(--dim); }
      .state.ok { color: var(--ok); }
      .state.bad { color: var(--bad); }

      pre {
        margin: 12px 0 0; padding: 10px; background: #15171b;
        border: 1px solid var(--line); border-radius: 8px;
        font: 12px/1.5 ui-monospace, Consolas, monospace;
        white-space: pre-wrap; word-break: break-all;
        max-height: 200px; overflow: auto;
      }
      .hint { color: var(--dim); font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="bar">
      <span class="title">皮肤管理 · 扩展主题</span>
      <button id="close" title="关闭">✕</button>
    </div>

    <main>
      <div class="toolbar">
        <span class="state" id="conn">未连接</span>
        <button id="refresh">刷新列表</button>
        <button id="clear" class="primary">恢复默认外观</button>
        <span class="hint">皮肤由扩展分发；应用后立即生效，无需重启。</span>
      </div>
      <p class="hint" id="scope">正在读取主题列表…</p>

      <h2>可用主题</h2>
      <div class="cards" id="cards"></div>

      <pre id="out">调用结果会显示在这里。</pre>
    </main>

    <script>
      (function () {
        "use strict";

        /* =====================================================================
         * 桥：与 hello-world 示例里那份完全一致，此处只保留必要部分。
         * 完整逐行讲解见 doc/扩展开发指南.md 6.6。
         * ===================================================================== */
        const EXT_ID = "skin-manager";        // ← 必须与 manifest.id 一致
        const HOST_SOURCE = "lumiluna-host";  // ← 宿主固定标识，不要改
        const EXT_SOURCE = "ext:" + EXT_ID;
        const INVOKE_TIMEOUT_MS = 31000;

        let seq = 0;
        const pending = new Map();

        window.addEventListener("message", function (ev) {
          const m = ev.data;
          if (!m || m.source !== HOST_SOURCE || m.type !== "invoke-result") return;
          const p = pending.get(m.reqId);
          if (!p) return;
          pending.delete(m.reqId);
          clearTimeout(p.timer);
          m.ok ? p.resolve(m.data) : p.reject(new Error(m.error || "调用失败"));
        });

        function invoke(method, payload) {
          return new Promise(function (resolve, reject) {
            const reqId = EXT_ID + "-" + (++seq);
            const timer = setTimeout(function () {
              if (pending.delete(reqId)) reject(new Error("调用超时：" + method));
            }, INVOKE_TIMEOUT_MS);
            pending.set(reqId, { resolve: resolve, reject: reject, timer: timer });
            window.parent.postMessage(
              { source: EXT_SOURCE, type: "invoke", reqId: reqId, method: method,
                payload: payload === undefined ? {} : payload },
              "*"
            );
          });
        }

        /* =====================================================================
         * themes:* —— 宿主保留的皮肤桥方法
         *
         *   themes:list   { }                     → [{ extId, id, name, path }]（全量，含别的扩展）
         *   themes:apply  { extId, themeId }       → { ok: true }
         *   themes:clear  { extId? }               → { ok: true }
         *
         * 宿主内部再去走 ext_themes() / ext_theme_load(extId, themeId) 这两条
         * Tauri 命令 —— 扩展 UI 调不到 Tauri 命令，只能走桥。见 6.4 的两层说明。
         * ===================================================================== */
        const themes = {
          /**
           * 返回【所有已启用扩展】声明的主题，每项带 extId —— 宿主有意做成全量的，
           * 这样管理器类扩展才能列出机器上全部可用皮肤。**过滤是你自己的活儿**，
           * 所以下面 everyThemes() 与 ownThemes() 各取所需。
           */
          listAll: function () {
            // ⚠️ 宿主返回的是 { themes: [...] }（与 SDK 的 theme.list() 一致），
            // **不是裸数组**。这里解一次包，下面所有消费处拿到的就都是数组。
            // 本仓库曾因指南/SDK/示例三处形状写得不一样，一直显示「共返回 0 套」。
            return invoke("themes:list", {}).then(function (res) {
              return res && Array.isArray(res.themes) ? res.themes : [];
            });
          },
          /** 只留本扩展声明的那些（正常管理界面用这个） */
          listMine: function () {
            return themes.listAll().then(function (all) {
              return (Array.isArray(all) ? all : []).filter(function (t) {
                return t.extId === EXT_ID;
              });
            });
          },
          apply: function (themeId) {
            return invoke("themes:apply", { extId: EXT_ID, themeId: themeId });
          },
          clear: function () {
            return invoke("themes:clear", { extId: EXT_ID });
          },
        };

        /* ---- UI ---- */
        const $ = function (id) { return document.getElementById(id); };
        const outEl = $("out");
        const cardsEl = $("cards");
        const connEl = $("conn");

        function show(data) {
          outEl.textContent = typeof data === "string" ? data : JSON.stringify(data, null, 2);
        }
        function setConn(ok, text) {
          connEl.textContent = text;
          connEl.className = "state " + (ok ? "ok" : "bad");
        }

        /** 当前已应用的主题 id（null = 默认外观）。仅本页面的乐观状态。 */
        let activeId = null;

        /** 给两套已知主题配个色卡；未知主题用通用色卡。 */
        function swatchClass(id) {
          if (id === "aurora") return "swatch";
          if (id === "sakura") return "swatch sakura";
          return "swatch builtin";
        }

        /** 宿主给的 path 形如 "themes/aurora/skin.json"，取中间那层做展示 */
        function themeDirLabel(path) {
          if (!path) return "";
          const parts = String(path).split("/");
          return parts.length >= 2 ? parts[parts.length - 2] : path;
        }

        function render(list) {
          cardsEl.innerHTML = "";

          // 「默认外观」永远排第一张卡
          cardsEl.appendChild(makeCard({
            id: "",
            name: "默认外观",
            meta: "不应用任何扩展主题，回到应用内建配色。",
            builtin: true,
          }));

          list.forEach(function (t) {
            cardsEl.appendChild(makeCard({
              id: t.id,
              name: t.name || t.id,
              meta: "id: " + t.id + "\n" + themeDirLabel(t.path),
            }));
          });
        }

        function makeCard(item) {
          const card = document.createElement("div");
          card.className = "card" + ((activeId || "") === item.id ? " active" : "");

          const sw = document.createElement("div");
          sw.className = item.builtin ? "swatch builtin" : swatchClass(item.id);
          card.appendChild(sw);

          const name = document.createElement("div");
          name.className = "name";
          name.textContent = item.name;
          card.appendChild(name);

          const meta = document.createElement("div");
          meta.className = "meta";
          meta.style.whiteSpace = "pre-line";
          meta.textContent = item.meta || "";
          card.appendChild(meta);

          const ops = document.createElement("div");
          ops.className = "ops";
          const btn = document.createElement("button");
          btn.className = "primary";
          const isActive = (activeId || "") === item.id;
          btn.textContent = isActive ? "已应用" : "应用";
          btn.disabled = isActive;
          btn.onclick = function () {
            if (item.builtin) {
              doClear();
            } else {
              doApply(item.id, item.name);
            }
          };
          ops.appendChild(btn);
          card.appendChild(ops);
          return card;
        }

        function refresh() {
          return themes.listAll().then(
            function (all) {
              setConn(true, "已连接宿主");
              const arr = Array.isArray(all) ? all : [];
              // 别人的主题也在这里面 —— 按 extId 挑出本扩展的，展示出来。
              const mine = arr.filter(function (t) { return t.extId === EXT_ID; });
              const others = arr.filter(function (t) { return t.extId !== EXT_ID; });
              render(mine);
              $("scope").textContent =
                "themes:list 共返回 " + arr.length + " 套：" +
                "本扩展 " + mine.length + " 套" +
                (others.length ? "，其它扩展 " + others.length + " 套（未列出）" : "");
              return mine;
            },
            function (err) {
              setConn(false, "未连接宿主");
              show("列出主题失败：" + err.message +
                   "\n（扩展窗口需要在宿主里打开；浏览器里直接开这个文件是连不通的。）");
              return [];
            }
          );
        }

        function doApply(themeId, name) {
          return themes.apply(themeId).then(
            function () {
              activeId = themeId;
              show("已应用主题：" + (name || themeId));
              return refresh();
            },
            function (err) {
              // 典型失败原因：skin.json 校验没过（宿主用 skinSchema.ts 校验后会回错误文本）
              show("应用失败：" + err.message);
            }
          );
        }

        function doClear() {
          return themes.clear().then(
            function () {
              activeId = null;
              show("已恢复默认外观。");
              return refresh();
            },
            function (err) { show("恢复失败：" + err.message); }
          );
        }

        $("refresh").onclick = function () { refresh(); };
        $("clear").onclick = function () { doClear(); };
        $("close").onclick = function () { window.close(); };

        // 首屏
        refresh();
      })();
    </script>
  </body>
</html>
