<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>磁盘透镜</title>
    <!--
      扩展前端：单文件、无构建步骤，直接由 ext: 协议提供。
      桥的用法照抄 doc/扩展开发指南.md §6.6，只把 EXT_ID 换成自己的 id。
    -->
    <style>
      :root {
        color-scheme: dark;
        --bg: #17191d;
        --card: #1e2126;
        --line: rgba(255, 255, 255, 0.09);
        --fg: #e6e8ea;
        --dim: rgba(255, 255, 255, 0.55);
        --accent: #6ea8fe;
        --danger: #e06c6c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      .wrap { display: flex; flex-direction: column; height: 100vh; }
      header {
        display: flex; align-items: center; gap: 10px;
        padding: 10px 14px; border-bottom: 1px solid var(--line);
        -webkit-app-region: drag;
      }
      header .spacer { flex: 1; }
      header button, .row button { -webkit-app-region: no-drag; }
      h1 { font-size: 14px; font-weight: 600; margin: 0; }
      .status { color: var(--dim); font-size: 12px; }
      main { flex: 1; overflow: auto; padding: 14px; display: grid; gap: 12px; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
      .card h2 { font-size: 12px; font-weight: 600; color: var(--dim); margin: 0 0 8px; letter-spacing: .04em; }
      button {
        background: rgba(255, 255, 255, 0.06); color: var(--fg);
        border: 1px solid var(--line); border-radius: 7px;
        padding: 5px 12px; font-size: 12px; cursor: pointer;
      }
      button:hover:not(:disabled) { background: rgba(255, 255, 255, 0.12); }
      button:disabled { opacity: .45; cursor: default; }
      button.primary { background: rgba(110, 168, 254, .18); border-color: rgba(110, 168, 254, .45); color: #cfe0ff; }
      textarea, input {
        width: 100%; background: rgba(0, 0, 0, .25); color: var(--fg);
        border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px;
        font: 12px/1.5 ui-monospace, Consolas, monospace;
      }
      .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 4px; }
      .bar { height: 6px; background: rgba(255, 255, 255, .08); border-radius: 3px; overflow: hidden; margin: 8px 0; }
      .bar > i { display: block; height: 100%; width: 30%; background: var(--accent); border-radius: 3px; animation: slide 1.1s ease-in-out infinite; }
      @keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
      .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
      table { width: 100%; border-collapse: collapse; font-size: 12px; }
      td, th { text-align: left; padding: 4px 6px; border-bottom: 1px solid rgba(255, 255, 255, .05); }
      th { color: var(--dim); font-weight: 500; }
      td.num, th.num { text-align: right; white-space: nowrap; }
      .path { word-break: break-all; color: var(--dim); }
      .empty { color: var(--dim); padding: 10px 0; }
      .errors { color: var(--danger); font-size: 12px; }
      .hint { color: var(--dim); font-size: 12px; }
      .tags { display: flex; flex-wrap: wrap; gap: 6px; }
      .tag { background: rgba(255, 255, 255, .06); border-radius: 10px; padding: 2px 9px; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>磁盘透镜</h1>
        <span class="status" id="status">正在连接引擎…</span>
        <span class="spacer"></span>
        <button class="primary" id="btn-scan">开始扫描</button>
        <button id="btn-cancel" disabled>取消</button>
      </header>
      <main>
        <section class="card">
          <h2>扫描设置</h2>
          <label for="roots">扫描目录（每行一个绝对路径）</label>
          <textarea id="roots" rows="3" spellcheck="false" placeholder="C:\Users\me\Downloads"></textarea>
          <div class="grid2" style="margin-top:10px">
            <div>
              <label for="topN">榜单条数</label>
              <input id="topN" type="number" min="1" max="500" />
            </div>
            <div>
              <label for="minMB">只收集大于（MB）</label>
              <input id="minMB" type="number" min="1" max="100000" />
            </div>
          </div>
          <div style="margin-top:10px; display:flex; gap:8px; align-items:center">
            <button id="btn-save">保存设置</button>
            <span class="hint" id="save-hint">设置存在宿主里（<span class="mono">settings:set</span>），与本扩展的数据目录分开</span>
          </div>
        </section>

        <section class="card" id="progress-card" hidden>
          <h2>进度</h2>
          <div class="bar"><i></i></div>
          <div class="hint mono" id="progress-text"></div>
        </section>

        <section class="card">
          <h2>概览</h2>
          <div id="summary" class="empty">还没有扫描结果，先点右上角「开始扫描」。</div>
        </section>

        <section class="card">
          <h2>最大的文件</h2>
          <div id="top-files" class="empty">—</div>
        </section>

        <section class="card">
          <h2>占用最多的目录</h2>
          <div id="by-subdir" class="empty">—</div>
        </section>

        <section class="card">
          <h2>按文件类型</h2>
          <div id="by-ext" class="empty">—</div>
        </section>

        <section class="card" id="errors-card" hidden>
          <h2>读取失败（已忽略）</h2>
          <div id="errors" class="errors mono"></div>
        </section>
      </main>
    </div>

    <script>
      /* ===== SilverMoon 扩展桥（扩展 API v2，照抄指南 §6.6） ===== */
      const EXT_ID = "disk-lens"; // 必须与 manifest.id 完全一致
      const HOST_SOURCE = "lumiluna-host";
      const EXT_SOURCE = "ext:" + EXT_ID;
      const INVOKE_TIMEOUT_MS = 30000;

      let seq = 0;
      const pending = new Map();

      window.addEventListener("message", (ev) => {
        const m = ev.data;
        if (!m || m.source !== HOST_SOURCE || m.type !== "invoke-result") return;
        const p = pending.get(m.reqId);
        if (!p) return;
        pending.delete(m.reqId);
        m.ok ? p.resolve(m.data) : p.reject(new Error(m.error || "调用失败"));
      });

      function invoke(method, payload) {
        return new Promise((resolve, reject) => {
          const reqId = EXT_ID + "-" + ++seq;
          pending.set(reqId, { resolve, reject });
          window.parent.postMessage(
            { source: EXT_SOURCE, type: "invoke", reqId, method, payload: payload || {} },
            "*",
          );
          setTimeout(() => {
            if (pending.delete(reqId)) reject(new Error("调用超时：" + method));
          }, INVOKE_TIMEOUT_MS);
        });
      }

      const settings = {
        get: () => invoke("settings:get").then((r) => (r && r.values) || {}),
        set: (values) => invoke("settings:set", { values }),
      };
      const revealPath = (p) => invoke("reveal", { path: p });

      /* ===== 工具 ===== */
      const $ = (id) => document.getElementById(id);

      function fmtBytes(n) {
        if (!n) return "0 B";
        const units = ["B", "KB", "MB", "GB", "TB"];
        let i = 0;
        let v = n;
        while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
        return (v >= 100 || i === 0 ? v.toFixed(0) : v.toFixed(1)) + " " + units[i];
      }
      const fmtNum = (n) => (n || 0).toLocaleString("zh-CN");

      function setStatus(text) { $("status").textContent = text; }

      function esc(s) {
        return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
      }

      /* ===== 设置 ===== */
      let options = { roots: [], topN: 30, minMB: 1, followSymlinks: false };

      function fillForm() {
        $("roots").value = (options.roots || []).join("\n");
        $("topN").value = options.topN || 30;
        $("minMB").value = options.minMB || 1;
      }

      function readForm() {
        return {
          roots: $("roots").value.split("\n").map((s) => s.trim()).filter(Boolean),
          topN: Number($("topN").value) || 30,
          minMB: Number($("minMB").value) || 1,
        };
      }

      async function loadSettings() {
        try {
          const values = await settings.get();
          options = Object.assign({}, options, values);
          fillForm();
        } catch (e) {
          setStatus("读取设置失败：" + e.message);
        }
      }

      async function saveSettings() {
        options = Object.assign({}, options, readForm());
        try {
          await settings.set(options);
          $("save-hint").textContent = "已保存";
          setTimeout(() => ($("save-hint").textContent = "设置存在宿主里（settings:set），与本扩展的数据目录分开"), 1800);
        } catch (e) {
          $("save-hint").textContent = "保存失败：" + e.message;
        }
      }

      /* ===== 扫描 ===== */
      let polling = null;

      function renderProgress(st) {
        const running = !!st.running;
        $("progress-card").hidden = !running;
        $("btn-scan").disabled = running;
        $("btn-cancel").disabled = !running;
        if (running) {
          $("progress-text").textContent =
            "已看到 " + fmtNum(st.files) + " 个文件 / " + fmtNum(st.dirs) + " 个目录 · " +
            fmtBytes(st.bytes) + " · " + (st.elapsedMs / 1000).toFixed(1) + "s\n" +
            (st.current || "");
          setStatus("扫描中…");
        }
      }

      function renderReport(rep) {
        if (!rep) return;
        setStatus(
          (rep.cancelled ? "已取消" : "完成") + " · " + fmtNum(rep.files) + " 文件 · " +
          (rep.elapsedMs / 1000).toFixed(1) + "s" + (rep.truncated ? " · 已达条目上限" : ""),
        );

        $("summary").className = "";
        $("summary").innerHTML =
          '<div class="tags">' +
          '<span class="tag">合计 <b>' + fmtBytes(rep.bytes) + "</b></span>" +
          '<span class="tag">文件 ' + fmtNum(rep.files) + "</span>" +
          '<span class="tag">目录 ' + fmtNum(rep.dirs) + "</span>" +
          '<span class="tag">耗时 ' + (rep.elapsedMs / 1000).toFixed(1) + "s</span>" +
          '<span class="tag">只统计 &gt; ' + esc(rep.minMB) + " MB</span>" +
          "</div>" +
          (rep.roots || []).map((r) => '<div class="path mono" style="margin-top:6px">' + esc(r) + "</div>").join("");

        // 最大的文件：每行一个「定位」按钮（走宿主保留方法 reveal，需 opener:open-path）
        $("top-files").className = "";
        $("top-files").innerHTML =
          '<table><thead><tr><th>文件</th><th class="num">体积</th><th></th></tr></thead><tbody>' +
          (rep.topFiles || []).map((f) =>
            "<tr><td class=\"path\">" + esc(f.path) + "</td>" +
            '<td class="num">' + fmtBytes(f.bytes) + "</td>" +
            '<td class="num"><button data-reveal="' + esc(f.path) + '">定位</button></td></tr>',
          ).join("") +
          "</tbody></table>";

        $("by-subdir").className = "";
        $("by-subdir").innerHTML =
          '<table><thead><tr><th>目录（相对扫描根）</th><th class="num">体积</th><th class="num">文件</th></tr></thead><tbody>' +
          (rep.bySubdir || []).map((d) =>
            "<tr><td class=\"mono\">" + esc(d.path) + "</td>" +
            '<td class="num">' + fmtBytes(d.bytes) + "</td>" +
            '<td class="num">' + fmtNum(d.count) + "</td></tr>",
          ).join("") +
          "</tbody></table>";

        $("by-ext").className = "";
        $("by-ext").innerHTML =
          '<table><thead><tr><th>类型</th><th class="num">体积</th><th class="num">文件</th></tr></thead><tbody>' +
          (rep.byExt || []).map((e) =>
            '<tr><td class="mono">' + esc(e.ext) + "</td>" +
            '<td class="num">' + fmtBytes(e.bytes) + "</td>" +
            '<td class="num">' + fmtNum(e.count) + "</td></tr>",
          ).join("") +
          "</tbody></table>";

        const errs = rep.errors || [];
        $("errors-card").hidden = errs.length === 0;
        $("errors").innerHTML = errs.map((e) => esc(e.path) + " — " + esc(e.error)).join("<br>");
      }

      function startPolling() {
        if (polling) return;
        polling = setInterval(async () => {
          try {
            const st = await invoke("status");
            renderProgress(st);
            if (!st.running) {
              clearInterval(polling);
              polling = null;
              renderReport(st.report);
            }
          } catch (e) {
            clearInterval(polling);
            polling = null;
            setStatus("轮询失败：" + e.message);
          }
        }, 400);
      }

      async function scan() {
        options = Object.assign({}, options, readForm());
        try {
          const res = await invoke("scan", options);
          if (!res || res.started === false) {
            setStatus(res && res.reason ? res.reason : "无法开始扫描");
            return;
          }
          setStatus("扫描中…");
          startPolling();
        } catch (e) {
          setStatus("启动扫描失败：" + e.message);
        }
      }

      async function cancel() {
        try { await invoke("cancel"); } catch (e) { setStatus("取消失败：" + e.message); }
      }

      /* ===== 启动 ===== */
      $("btn-scan").addEventListener("click", scan);
      $("btn-cancel").addEventListener("click", cancel);
      $("btn-save").addEventListener("click", saveSettings);
      $("top-files").addEventListener("click", (ev) => {
        const path = ev.target && ev.target.getAttribute && ev.target.getAttribute("data-reveal");
        if (path) revealPath(path).catch((e) => setStatus("定位失败：" + e.message));
      });

      (async function boot() {
        // 自查：URL 上的 ext 参数必须与 EXT_ID 一致，否则桥的消息会被宿主静默丢弃
        const params = new URLSearchParams(location.search);
        const urlExt = params.get("ext");
        if (urlExt && urlExt !== EXT_ID) {
          setStatus("EXT_ID（" + EXT_ID + "）与 URL 的 ext=" + urlExt + " 不一致，桥不会通");
          return;
        }
        await loadSettings();
        try {
          const st = await invoke("status");
          renderProgress(st);
          if (st.running) startPolling();
          else if (st.report) renderReport(st.report);
          else setStatus("就绪");
        } catch (e) {
          setStatus("连接引擎失败：" + e.message);
        }
      })();
    </script>
  </body>
</html>
