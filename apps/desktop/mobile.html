<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 不写 user-scalable=no / maximum-scale=1：那会连双指缩放一起禁掉。
         输入框聚焦放大问题的正解是 mobile.css 里把输入框字号提到 16px。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark light" />
    <!-- 页面是从 127.0.0.1 的 loopback 服务加载的，跨域请求默认会带上
         Referer: http://127.0.0.1:PORT/ 这个陌生来源。网易云/酷狗的图片
         与音频地址普遍有防盗链，看到外来 Referer 会直接 403 —— 表现就是
         「封面全是占位图」。桌面端页面来源不同所以没暴露这个问题。
         显式声明 no-referrer，跨域请求干脆不带 Referer。 -->
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f7fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101014" />
    <title>SilverMoon</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/mobile/main-mobile.ts"></script>
  </body>
</html>
