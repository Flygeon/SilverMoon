[package]
name = "silvermoon-steam"
version = "0.1.0"
description = "Steam CM 连接层与 depot 下载器（供 SilverMoon 后端调用）"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-only"

[dependencies]
# CM 长连接：与参考实现 Aurelia 同源。
# 选它而不是自己造协议：CM 协议含 RSA 密钥交换、protobuf 编解码、心跳、重连，
# 自己写要上万行，且本机没有 MSVC 链接器、无法编译验证。
steam-vent = "0.5"
# CM service method 的请求/响应类型定义（GetManifestRequestCode / GetCDNAuthToken）
steam-vent-proto-steam = "=0.5.2"

tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
thiserror = "1"
tracing = "0.1"
serde_json = "1"
# depot_key.rs 的 EncodableMessage 签名用 BytesMut
bytes = "1"

# ---- depot 下载所需的加密与解析 ----
# 版本与 backend/Cargo.toml **刻意保持一致**：同一 crate 图里出现两份
# aes/cbc 会让类型不互通（各自定义了自己的 Block/SessionKey）。
# ⚠️ alloc 只能加在 **cbc** 上：aes 本身没有 alloc feature（只有 hazmat），
# 而 decrypt_padded_vec_mut / encrypt_padded_vec_mut 定义在 cbc 的 Encryptor/Decryptor 上，
# 由 cbc 的 alloc → cipher/alloc 打开。
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
ecb = "0.1"
sha1 = "0.10"
# manifest / chunk 的 VZ 压缩（Valve 自定义封装）
# - VZa*  → LZMA raw 流（lzma-rs）
# - VSZa* → zstd 帧（ruzstd，纯 Rust 实现，无需 C 工具链）
# - PK\x03\x04 → 普通 zip（flate2）
flate2 = "1"
# raw_decoder：Valve 的 VZa 流**没有** LZMA 属性头，必须用 raw 解码器显式传参
lzma-rs = { version = "0.3", features = ["raw_decoder"] }
ruzstd = "0.7"
# CDN 拉取与 WebAPI 调用
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls", "gzip"] }
# 少数 chunk 用普通 zip 封装（版本与 backend 一致，避免两份）
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
