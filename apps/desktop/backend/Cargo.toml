[package]
name = "silvermoon"
version = "0.0.2"
description = "SilverMoon —— 本地优先全媒体库应用（Electron + Vue 3 + Rust 后端）"
authors = ["SilverMoon"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.82"

[lib]
name = "silvermoon_lib"
crate-type = ["rlib"]

# ---------------------------------------------------------------------------
# 依赖说明
#
# 本 crate 是 SilverMoon 的后端（sidecar 进程），由 Electron 主进程拉起。
# 它与宿主之间只有一个约定：`silvermoon-ipc` 把命令注册进路由表，由本地
# HTTP 服务（`POST /cmd`）暴露；事件经 SSE（`GET /events`）回推。详见
# `crates/silvermoon-ipc/src/lib.rs`。
#
# 因此这里不需要任何桌面框架依赖：
#   * 窗口、托盘、文件对话框、系统默认程序  —— 由 Electron 主进程负责
#   * 系统媒体控件（SMTC）                —— 本 crate 内用 smtc-tokio 直接实现
#   * 全局热键                            —— 由 Electron 注册，回调经 /_host 转发进本进程
# ---------------------------------------------------------------------------

[features]
# 默认开启 SMTC（Win10+）。Win7 构建用
# `--no-default-features --features win7` 关掉它。
default = ["smtc"]
smtc = ["smtc-tokio"]
# 标记 Win7 目标：把 Win10+ 专有特性（目前是 SMTC）整体短路。
# 单独一个 feature 而不是靠 cfg(target_os) 判断，是因为 Win7 与 Win10 是同一个
# target_os（windows），编译器分不出来。
win7 = []

[dependencies]
silvermoon-ipc = { path = "crates/silvermoon-ipc" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
# 错误处理规范化：thiserror 用于定义强类型错误枚举，anyhow 用于内部函数便捷传播
thiserror = "1"
anyhow = "1"
walkdir = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
lofty = "0.20"
kamadak-exif = "0.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "ico"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"
scraper = "0.20"
regex = "1"
tokio = { version = "1", features = ["full"] }
rayon = "1"
base64 = "0.22"
getrandom = "0.2"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "stream", "native-tls", "charset", "gzip", "json"] }
# WebDAV 直接用到的传递依赖需显式声明（Rust 不允许隐式使用传递依赖）
url = "2"
httpdate = "1"
percent-encoding = "2"
# 网易云音乐 weapi/eapi 签名（移植自 api-enhanced，纯 Rust 实现）
aes = "0.8"
cbc = "0.1"
ecb = "0.1"
rsa = { version = "0.9", features = ["pem", "hazmat"] }
md-5 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
# 网易云 xeapi 协议（匿名身份注册，风控必需）：X25519 + AES-128-GCM + HMAC-SHA256 + gzip
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
flate2 = "1"
roxmltree = "0.20"
# WebDAV / anime 媒体本地代理：绑定 127.0.0.1 随机端口的轻量 HTTP 服务（SMTC 封面服务同款，跨平台）
tiny_http = "0.12"
# 酷狗音乐 API 客户端（vendored from MD3Music，AGPL-3.0）。
# 以 path 依赖形式链接：kugou.rs 经 kugou_server::bridge 进程内直调其路由表，
# 不启动其 HTTP 服务端。该 crate 内已自带 ureq/sha1/rand/qrcode 等依赖。
kugou_server = { path = "kugou_server" }

# Windows 系统媒体控件（SMTC）：把本应用注册为系统媒体会话。
# 仅在 Windows 编译，Linux/macOS 构建不受影响。
#
# **optional**：Win7 兼容版必须关掉它——SMTC 是 Windows 10 才有的 WinRT API，
# 而 `cfg(windows)` 在 win7 目标上**依然成立**，不关就会照样链接 Win10+ 符号。
# 见 [features] 的 `smtc` / `win7`。
[target.'cfg(windows)'.dependencies]
smtc-tokio = { version = "0.1", optional = true }

# ---------------------------------------------------------------------------
# 发布构建配置
#
# 这里刻意**不用**最激进的优化（`lto = true` 等价于 fat LTO、`codegen-units = 1`）：
# 实测那套组合让 CI 的 Windows release 编译到 572s，而加速手段（CI 缓存）对
# fat LTO 的最终链接阶段几乎无效。本应用后端的负载是网络抓取 / SQLite /
# 文件解码，属于 I/O 密集型，thin LTO 与 4 个 codegen unit 的运行时差距
# 在实测中不可感知，构建时间却能省下大约一半。
# ---------------------------------------------------------------------------
[profile.release]
codegen-units = 4
lto = "thin"
opt-level = "s"
strip = true
# 注意：**不要**开 `panic = "abort"`。后端现在是长期驻留的独立进程，
# 保留 unwind 语义才能让某个命令的 panic 只影响当次调用，而不是整块后端一起退出。

# ---------------------------------------------------------------------------
# Win7 兼容补丁：parking_lot_core 的 apiset 探测
#
# **Bug**（已在真实 Win7 上复现）：
#
#   `parking_lot_core` 的 Windows 线程停靠后端在选择实现时，会先用
#   `GetModuleHandleA("api-ms-win-core-synch-l1-2-0.dll")` 探测 Win8+ 的
#   `WaitOnAddress`。该名字是 **API Set 桩名**，而 API Set 重定向是
#   Win8 才引入的机制。在 Win7 上，`kernelbase!GetModuleHandleA` 解析
#   apiset 名时会读一张未初始化的表 —— **不是返回 NULL，而是直接抛
#   STATUS_ACCESS_VIOLATION (0xC0000005)**。
#
#   于是上游代码里那句 `if synch_dll == 0 { return None; }` 永远执行不到，
#   回退到 `KeyedEvent`（XP+ 可用）的 `else if` 分支根本没机会跑。
#   进程在 CRT 静态构造期就死掉 —— **连 main 的第一行都到不了**，
#   所以任何「在 main 里打点」的诊断都收不到日志。
#
# **症状**（与实测完全吻合）：
#   * 退出码 0xC0000005 / 3221225477（是 AV，不是缺 DLL 的 0xC0000135）；
#   * 无任何日志文件生成（崩在 main 之前）；
#   * 每次启动稳定复现，耗时一致；
#   * `objdump -p` 查导入表**完全看不出问题** ——
#     `WaitOnAddress` 等符号由 `GetProcAddress` 动态解析，不在导入表里。
#
# **修法**：见 `patches/parking_lot_core/` —— 在 `WaitAddress::create()`
# 开头加一次真实版本判断（`RtlGetVersion`），Win7 及更早直接 `return None`，
# 强制回退到 `KeyedEvent`。**只改这一处**，其余逻辑与上游一致。
#
# 为什么用 `[patch]` 而不是升级版本：`parking_lot_core` 0.9.12 已是最新，
# 上游这条路径对 Win7 就是坏的（它在 CI 上跑 Win10+，永远看不到这个问题）。
#
# 维护提示：升级 `parking_lot` / `parking_lot_core` 时，
# **必须**检查该文件在上一版基础上是否被改过，并把补丁重新应用一次。
# 校验命令：`grep -n "SilverMoon 补丁" patches/parking_lot_core/src/thread_parker/windows/waitaddress.rs`
# ---------------------------------------------------------------------------
[patch.crates-io]
parking_lot_core = { path = "patches/parking_lot_core" }
