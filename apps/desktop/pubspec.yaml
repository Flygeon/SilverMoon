name: silvermoon
description: "SilverMoon（银月）桌面端 — Flutter 宿主"
publish_to: 'none'
version: 0.0.1+1

# Flutter 3.47.5 自带 Dart 3.13.4；go_router 18 要求 Dart >=3.12，故此处声明真实下限。
environment:
  sdk: ^3.12.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理：与 apps/mobile 保持一致（provider，不用 riverpod）
  provider: ^6.1.2
  # 路由：Electron 版 19 条 vue-router 路由的等价表达
  go_router: ^18.0.2
  # 无边框窗口 / 自定义标题栏 / 最小化最大化关闭 / 窗口拖拽
  window_manager: ^0.5.2
  # 打开 GitHub 仓库等外部链接
  url_launcher: ^6.3.2
  # 目录/文件选择：添加媒体库扫描目录（方案 §5.6 指定）
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # 从 app-icon.png 生成 windows/runner/resources/app_icon.ico
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    # 应用元信息唯一真源：Rust 编译期、Electron 运行期、Flutter 宿主运行期共读同一份
    - backend/silvermoon.config.json

  # 字族与 Electron 版对齐（archive/electron-desktop/src/tokens/theme.css 的 body 字族栈）：
  #   Roboto（拉丁）→ SarasaGothicSC-Regular（中日韩）→ 系统兜底
  #
  # Roboto 用的是 Google 官方【静态实例】（v51 / Version 3.015），与归档同源同版本。
  # 归档里的 latin-400/500/700.woff2 其实是同一份可变字体分片（三个文件 sha 完全相同、
  # 都带 fvar 表）：浏览器靠 font-weight 声明自动实例化，Flutter 不会按 FontWeight
  # 驱动可变字体轴，照搬会导致【粗体不变粗】，所以换成静态实例。
  # SarasaGothicSC-Regular.ttf 由归档里的 .woff 解出，逐表校验和与 WOFF 目录记录一致。
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Italic.ttf
          weight: 400
          style: italic
    - family: SarasaGothicSC-Regular
      fonts:
        - asset: assets/fonts/SarasaGothicSC-Regular.ttf
          weight: 400

flutter_launcher_icons:
  windows:
    generate: true
    image_path: "app-icon.png"
    icon_size: 256
