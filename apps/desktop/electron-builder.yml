appId: cn.cool.silvermoon
productName: SilverMoon
copyright: Copyright © SilverMoon contributors

directories:
  output: release
  buildResources: build

# `files` 是**顺序敏感**的 minimatch 列表：app-builder-lib/out/util/filter.js 的
# minimatchAll 逐条走「已命中就只再测排除项、未命中就只再测包含项」。
# 所以「勾回 taglib-wasm」必须写在「排除整个 node_modules」**之后**，否则永远匹配不上。
#
# 踩过的坑（安装包实测报 `Cannot find package 'taglib-wasm'`）：
# 1. 原来把 `node_modules/taglib-wasm/dist/**/*` 写在 `!node_modules/**/*` **之前**，
#    排除项后手生效 → dist 根本没进包；
# 2. 更隐蔽的是 electron-builder 还会**自动注入** `!**/node_modules/**`，并且
#    getMainFileMatchers 一见到第一个含 node_modules 的**正向**模式，就把这条注入到它
#    前面（fileMatcher.js 的 insertExculdeNodeModulesIndex）。「正向在前」被双重堵死；
# 3. 就算 dist 进了包也不够：Node 的 ESM 解析要先读包内 package.json 的 exports 才能
#    定位入口，只给 dist/** 会直接报找不到包（实测复现过）。
#
# 另外 node_modules 还有一条**独立**支路（platformPackager.js 无条件调用
# computeNodeModuleFileSets），那条支路**只取本数组里的 "!" 排除项**、再
# prependPattern("**/*")：正向模式不进它，`!node_modules/**/*` 才是阻止「整棵生产
# 依赖树被塞进 asar」的闸门（不写它解包后约 55MB：pdfjs-dist / @m3e/web / hls.js）。
# 两条支路合起来：排除照旧生效，跟在后面的正向白名单把需要的包勾回来。
files:
  # 1) 先排掉生产依赖树（重复打包 ~55MB），后面的白名单再按需勾回。
  - "!node_modules/**/*"
  # 2) 真正要进包的东西
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - "!**/*.map"
  # 3) taglib-wasm 例外：运行期 external（ESM-only，不能打进 main.cjs），
  #    必须**整包**随包分发（含 package.json 与 dist 里的 wasm/JS 胶水）。
  - node_modules/taglib-wasm/**/*
  # 4) taglib-wasm 的运行时依赖：WASI 后端读写用它做 msgpack 编解码
  #    （decoder.js / wasm-io.js 静态 import "@msgpack/msgpack"）。
  - node_modules/@msgpack/msgpack/**/*

# extraResources **只在各平台条目里声明，顶层一律不写**。
#
# 两条原因都是实测踩出来的：
#  1. electron-builder 对「平台级 extraResources 与顶层」到底是合并还是覆盖，
#     不同版本行为不一致，写在两边语义不确定；
#  2. 更要命的是：同一个 `from → to` 若同时出现在顶层与平台级，electron-builder
#     会把它当成两条 matcher，**并发**地向同一个目标 copyfile —— Windows 上必踩
#     `EBUSY: resource busy or locked`（Linux 恰好容忍），表现为 NSIS 打包整步失败。
#
# 因此每个平台在自己的清单里写全（图标 + 后端可执行文件），任何版本下语义唯一。
# 另外**不能**把 Windows 的 .exe 写在顶层：Linux 构建会去找一个不存在的文件。

asar: true

# taglib-wasm 的 wasm 与 JS 胶水要在 asar 之外真实落盘：
# Node 的 createRequire/动态 import 解析 asar 内部路径会拿到不可用的 fs 路径，
# WASI 后端还要用真实文件系统打开 .wasm。
asarUnpack:
  - node_modules/taglib-wasm/**

# Electron 自带 55 个语言包（locales/*.pak），实测解包后 48.3MB，而界面只提供中文。
# 只保留 zh-CN / en-US 两个（各约 0.56MB），其余由 electron-builder 在打包后删除。
# 实现见 app-builder-lib/out/electron/ElectronFramework.js 的
# removeUnusedLanguagesIfNeeded()。系统语言不在列表内时 Electron 回退到 en-US。
electronLanguages:
  - zh-CN
  - en-US

win:
  icon: backend/icons/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  extraResources:
    - from: backend/icons/icon.png
      to: icon.png
    # 后端以独立可执行文件随包分发（Electron 主进程 spawn 拉起，不能塞进 asar）。
    # 构建前请先执行 npm run build:backend:release。
    - from: backend/target/release/silvermoon.exe
      to: bin/silvermoon-server.exe
    - from: node_modules/taglib-wasm/dist/taglib-wasi.wasm
      to: taglib-wasm/taglib-wasi.wasm
    # 原生启动器（Rust + Win32，MD3 自绘 splash，约 0.3MB）。
    # 它与 SilverMoon.exe 同级落地：启动器按自身所在目录去找 Electron，
    # 不依赖注册表或环境变量。构建前需先 cargo build（见 CI）。
    - from: splash/target/release/silvermoon-splash.exe
      to: silvermoon-splash.exe

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SilverMoon
  artifactName: ${productName}-${version}-setup.${ext}
  # 用自定义脚本把**快捷方式指向启动器**而不是 Electron 本体：
  # 只有从启动器进来才有无缝的 splash 过渡。脚本见 build/installer.nsh。
  include: build/installer.nsh

mac:
  icon: backend/icons/icon.icns
  category: public.app-category.entertainment
  target:
    - dmg
  extraResources:
    - from: backend/icons/icon.png
      to: icon.png
    - from: backend/target/release/silvermoon
      to: bin/silvermoon-server
    - from: node_modules/taglib-wasm/dist/taglib-wasi.wasm
      to: taglib-wasm/taglib-wasi.wasm

linux:
  icon: backend/icons/icon.png
  category: AudioVideo
  target:
    - AppImage
  extraResources:
    - from: backend/icons/icon.png
      to: icon.png
    - from: backend/target/release/silvermoon
      to: bin/silvermoon-server
    - from: node_modules/taglib-wasm/dist/taglib-wasi.wasm
      to: taglib-wasm/taglib-wasi.wasm
