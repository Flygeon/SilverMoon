<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 不写 user-scalable=no / maximum-scale=1：那会连双指缩放一起禁掉。
         输入框聚焦放大问题的正解是 mobile.css 里把输入框字号提到 16px。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f7fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101014" />
    <title>SilverMoon</title>
    <script type="module" crossorigin src="./assets/mobile-DyzKzHwk.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/mobile-BT_wjP5N.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
