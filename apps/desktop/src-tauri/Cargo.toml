[package]
name = "silvermoon"
version = "0.1.0"
description = "SilverMoon —— 本地优先全媒体库应用（Tauri 2 + Vue 3 + Rust）"
authors = ["SilverMoon"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.82"

[lib]
name = "silvermoon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ---------------------------------------------------------------------------
# 桌面框架
#
# 与迁移到 Electron 之前的那一版一致：tray-icon / image-png / protocol-asset
# 是必需的（托盘、托盘图标解码、asset:// 本地文件代理）。
# devtools 只在 debug 构建里生效，保留它以便开发期打开开发者工具。
# ---------------------------------------------------------------------------
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools", "protocol-asset"] }

# Tauri 2 官方插件。这些能力在 Electron 版里由主进程手写实现，换回 Tauri 后
# 直接交给插件（渲染进程侧的调用点见 src/ipc/ 的相应模块）：
#   dialog  → src/ipc/dialog.ts   (文件 / 目录选择、消息框)
#   fs      → src/ipc/fs.ts       (文件读写)
#   store   → src/ipc/store.ts    (设置持久化)
#   opener  → src/ipc/opener.ts   (系统默认程序打开 / 定位文件)
#   http    → src/ipc/http.ts     (绕过 CORS 的 HTTP 请求)
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
# ⚠️ 必须启用 unsafe-headers，否则**所有 Cookie / Referer 会被静默丢弃**：
# 插件默认按 fetch 规范过滤「禁止的头」（is_unsafe_header 里含 COOKIE / REFERER /
# ORIGIN / HOST 等），且**只在 debug 构建打警告，release 下完全无声**。
# 桌面端不是浏览器，没有同源策略可言，这层过滤只会造成功能缺失：
#   - B 站：Referer 被丢 → 风控 403；Cookie 被丢 → nav 拿不到 wbi_img → WBI 签名失败
#   - 网易云 / 酷狗 / Pixiv 等同样依赖 Cookie 的接口全部受影响
# Electron 版用 undici，本来就没有这层过滤，行为以此为准。
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
# 全局热键：扩展框架注册热键（src/commands/extension.rs 唯一调用点）
tauri-plugin-global-shortcut = "2"
# 自动更新：替代 electron-updater，保留「只提示、不自动重启」的产品行为
tauri-plugin-updater = "2"
# ---------------------------------------------------------------------------
# GPU 画布（wgpu）
#
# 用途：绘画的画布改为 **wgpu 直绘**（不再走 WebView 的 Canvas 2D）。
# 动机见 doc/GPU-CANVAS.md：Canvas 2D 没有合成器，多图层下每次重绘都要
# 把上千个节点重画一遍；wgpu 走真正的 GPU 合成。
#
# 版本取 30 与参考实现（photocraft）一致 —— 它是经过验证的组合。
# 只开需要的特性：std（桌面必需）+ wgsl（着色器语言）。
wgpu = { version = "30", default-features = false, features = ["std", "wgsl"] }
# wgpu 的 request_adapter / request_device 是 async；主线程里需要一个最小的
# 阻塞执行器。pollster 只做这一件事，比引入整个 tokio 运行时轻得多
# （tokio 已在依赖里，但它是给 reqwest 用的，不该拿来跑渲染初始化）。
pollster = "0.4"

silvermoon-bili = { path = "crates/silvermoon-bili" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
# 错误处理规范化：thiserror 用于定义强类型错误枚举，anyhow 用于内部函数便捷传播
thiserror = "1"
anyhow = "1"
walkdir = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
lofty = "0.20"
kamadak-exif = "0.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "ico"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"
scraper = "0.20"
regex = "1"
tokio = { version = "1", features = ["full"] }
rayon = "1"
base64 = "0.22"
getrandom = "0.2"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "stream", "native-tls", "charset", "gzip", "json"] }
# WebDAV 直接用到的传递依赖需显式声明（Rust 不允许隐式使用传递依赖）
url = "2"
httpdate = "1"
percent-encoding = "2"
# 网易云音乐 weapi/eapi 签名（移植自 api-enhanced，纯 Rust 实现）
aes = "0.8"
cbc = "0.1"
ecb = "0.1"
rsa = { version = "0.9", features = ["pem", "hazmat"] }
md-5 = "0.10"
# SHA-1：music_tags.rs 用它生成缓存文件名（`covers/cover-<sha1(key)>.<ext>`、
# `lyrics/<sha1(key)>.txt`、`local-backup/<sha1(id)>.json`）。
# 必须与 Electron 版一致，**旧缓存才能直接复用**，所以不能换成别的哈希。
sha1 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
# 网易云 xeapi 协议（匿名身份注册，风控必需）：X25519 + AES-128-GCM + HMAC-SHA256 + gzip
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
flate2 = "1"
roxmltree = "0.20"
# WebDAV / anime 媒体本地代理：绑定 127.0.0.1 随机端口的轻量 HTTP 服务（SMTC 封面服务同款，跨平台）
tiny_http = "0.12"
# 酷狗音乐 API 客户端（vendored from MD3Music，AGPL-3.0）。
# 以 path 依赖形式链接：kugou.rs 经 kugou_server::bridge 进程内直调其路由表，
# 不启动其 HTTP 服务端。该 crate 内已自带 ureq/sha1/rand/qrcode 等依赖。
kugou_server = { path = "kugou_server" }

# ---------------------------------------------------------------------------
# 桌面环境集成（UDA / UniDesktop API v0.2.0）
#
# 覆盖四项能力：壁纸设置、常亮锁（防休眠）、系统通知、系统强调色。
# 之所以不直接调各平台 API：这四项在 Linux 上按桌面环境分裂为 gsettings /
# plasmashell / hyprpaper / swww / feh，Windows 上又是另一套 Win32 / WinRT，
# 且各自的失败模式不同；UDA 用一套能力驱动的 Rust trait 统一，并给出能力位
# 让前端在出错**之前**分流。
#
# 只引入 core + 对应平台实现，不引入 uda-ffi：本后端是原生 Rust，不需要 C-ABI。
# 上游尚未发布到 crates.io，故以 git 依赖引入并 **pin 到确定 commit**
# （上游 v0.2.0、API 未稳定，不要改成跟踪分支）。
# 许可：MIT OR Apache-2.0（双许可），与本项目 GPL-3.0-only 单向兼容。
#
# 注意：uda-platform-windows 整个 crate 是 #![cfg(windows)]，在非 Windows
# 目标上编译为空；Linux 侧同理只在 Linux 目标下引入，macOS 不受影响
# （desktop.rs 内有对应的 unsupported 分支返回明确错误，而非编译失败）。
# ---------------------------------------------------------------------------
[target.'cfg(target_os = "linux")'.dependencies]
uda-core = { git = "https://github.com/UniDesktop/SDK", rev = "19453c4fcd87b4af2e424fef2708c08e907c2ab9" }
uda-platform-linux = { git = "https://github.com/UniDesktop/SDK", rev = "19453c4fcd87b4af2e424fef2708c08e907c2ab9" }

# Windows 系统媒体控件（SMTC）：把本应用注册为系统媒体会话。
# 仅在 Windows 编译，Linux/macOS 构建不受影响。
[target.'cfg(windows)'.dependencies]
smtc-tokio = "0.1"
uda-core = { git = "https://github.com/UniDesktop/SDK", rev = "19453c4fcd87b4af2e424fef2708c08e907c2ab9" }
uda-platform-windows = { git = "https://github.com/UniDesktop/SDK", rev = "19453c4fcd87b4af2e424fef2708c08e907c2ab9" }

# ---------------------------------------------------------------------------
# 发布构建配置
#
# 与 Electron 版（sidecar 进程）的关键差异：本 crate 现在是**桌面应用的
# 主程序本体**，随窗口进程一起存在，因此恢复旧 Tauri 版的激进优化
# （fat LTO + 单 codegen unit + panic = abort）。
#
# panic = "abort" 在这里是安全的：后端不再是「长期驻留、单命令 panic 只影响
# 当次调用」的独立进程，而是与 UI 同命运的应用进程。
# ---------------------------------------------------------------------------
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
