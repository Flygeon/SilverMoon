[package]
name = "silvermoon-fqapi"
version = "0.1.0"
edition = "2021"
description = "SilverMoon 的番茄（fqnovel）内容源核心：签名 / 设备池 / 上游调用 / 端点"
license = "GPL-3.0-only"
publish = false
# 从 fqapp (github.com/ch6vip/fqapp, GPL-3.0) 的 rust/ 核心裁剪而来。
# 删除了原项目的宿主形态：flutter_rust_bridge 桥、loopback HTTP 适配器、
# 内置 WebUI 与 HTML 页面端点。保留纯业务层，作为独立 sidecar 进程运行。

[lib]
name = "fqapi_core"
path = "src/lib.rs"

[[bin]]
name = "silvermoon-fqapi"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util", "io-std"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "http2", "rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
cipher = { version = "0.4", features = ["alloc", "block-padding"] }
md-5 = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
num-bigint = { version = "0.4", features = ["rand"] }
num-traits = "0.2"
flate2 = "1"
percent-encoding = "2"
once_cell = "1"
zeroize = { version = "1", features = ["derive"] }
regex = "1"
url = "2"
futures = "0.3"
log = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# panic 必须 unwind：sidecar 内一次 panic 应转为错误返回，而不是整个进程 abort。
