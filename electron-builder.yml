appId: cn.cool.silvermoon
productName: SilverMoon
copyright: Copyright © SilverMoon (银月) contributors

directories:
  output: release
  buildResources: build

# 只打包运行期需要的东西：前端产物、Electron 主进程产物、package.json
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - "!**/*.map"

# 注意：`extraResources` 的「平台级与顶层」到底是合并还是覆盖，electron-builder
# 不同版本行为不一致。为了两种情况都对，这里**每个平台条目里都把图标再写一遍**，
# 顶层只留一份图标给未特别声明的场景。
#
# 另外**不能**把 Windows 的 .exe 写在顶层：Linux 构建会去找一个不存在的文件。
extraResources:
  - from: backend/icons/icon.png
    to: icon.png

asar: true

win:
  icon: backend/icons/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  extraResources:
    - from: backend/icons/icon.png
      to: icon.png
    # 侧车以独立可执行文件随包分发（Electron 主进程 spawn 拉起，不能塞进 asar）。
    # 构建前请先执行 npm run build:backend:release。
    - from: backend/target/release/silvermoon.exe
      to: bin/silvermoon-server.exe

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 银月
  artifactName: ${productName}-${version}-setup.${ext}

mac:
  icon: backend/icons/icon.icns
  category: public.app-category.entertainment
  target:
    - dmg
  extraResources:
    - from: backend/icons/icon.png
      to: icon.png
    - from: backend/target/release/silvermoon
      to: bin/silvermoon-server

linux:
  icon: backend/icons/icon.png
  category: AudioVideo
  target:
    - AppImage
  extraResources:
    - from: backend/icons/icon.png
      to: icon.png
    - from: backend/target/release/silvermoon
      to: bin/silvermoon-server
